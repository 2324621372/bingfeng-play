<script>
'use strict';
/* ================= 涂鸦渲染基础 =================
 * 抖动墨线描边 + 错位马克笔填色 + 斜向排线阴影 + 手写字
 * 所有图形都由代码生成，不依赖图片资源

const INK = '#2b2118', RED = '#e23b2e', PAPER = '#fbf4df';
const C = { spear: '#ff6b5b', cav: '#4d8df0', bow: '#45bf66', mage: '#a66bf0', shield: '#9aa3b2', undead: '#6fcf97', gold: '#ffc93c' };
const CD = { spear: '#b8352a', cav: '#2a58a8', bow: '#23803d', mage: '#6532a8', shield: '#5a6372', undead: '#2f7a52' };
const CL = { spear: '#ffc2b8', cav: '#bcd4ff', bow: '#bfeac9', mage: '#e0caff', shield: '#e3e6ec', undead: '#cdf0dc' };
const NAME = { spear: '枪', cav: '骑', bow: '弓', mage: '法', shield: '盾', undead: '亡' };
const FONT = '"BFKL","Microsoft YaHei","PingFang SC","Heiti SC",sans-serif';

// 可复现的伪随机（保证同一图形每次绘制形状一致，不会"闪烁"）
let _s = 1;
const srand = s => { _s = (s >>> 0) || 1; };
const R = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const J = a => (R() - .5) * 2 * a;

function subdiv(pts, closed, seg) {
  const o = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(L / seg));
    for (let j = 0; j < k; j++) { const t = j / k; o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  if (!closed) o.push(pts[n - 1]);

}
function path(g, p, closed) {
  g.beginPath();
  const n = p.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (closed) {
    g.moveTo(...m(p[n - 1], p[0]));
    for (let i = 0; i < n; i++) { const q = m(p[i], p[(i + 1) % n]); g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); }

  } else {
    g.moveTo(...p[0]);
    for (let i = 1; i < n - 1; i++) { const q = m(p[i], p[i + 1]); g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); }

  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  p.forEach(([x, y]) => { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); });

}
function hatch(g, [x, y, w, h], hc) {
  const gap = hc.gap || 7, an = hc.ang ?? -.9, ca = Math.cos(an), sa = Math.sin(an), d = Math.hypot(w, h), cx = x + w / 2, cy = y + h / 2;

}
// 核心图元：抖动描边 + 错位填色 + 排线阴影
function shape(g, pts, o = {}) {

const ln = (g, p, o = {}) => shape(g, p, { ...o, closed: false });
function ell(cx, cy, rx, ry, rot = 0, n) {

// 我方兵种 atk 打敌方兵种 def 的伤害倍率
function counterMul(atk, def) {
  if (def === 'shield') return atk === 'mage' ? 1.5 : 0;
  if (def === 'undead') return atk === 'mage' ? 2 : .35;
  if (atk === 'mage') return 1;
  if (BEATS[atk] === def) return 2;
  if (BEATS[def] === atk) return .5;
  return 1;
}
function counterOf(def) {
  if (def === 'shield' || def === 'undead') return 'mage';
  for (const k in BEATS) if (BEATS[k] === def) return k;
  return 'mage';
}

// 可复现的关卡随机数
function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pickW(r, w) {
  let s = 0; for (const k in w) s += w[k];
  let x = r() * s; for (const k in w) { x -= w[k]; if (x <= 0) return k; }
  return Object.keys(w)[0];
}
function enemyPool(sc, li) {
  const w = { spear: 1, cav: 1, bow: li === 0 && sc === 0 ? .4 : 1 };
  if (sc >= 1 && li >= 2) w.shield = .2 + .06 * sc;
  if (sc === 3) w.undead = .4;
  if (sc === 4) w.undead = .3;
  return w;
}
// 生成一波：difficulty 0..39，返回按时间排序的出兵表
function genWave(r, diff, sc, li, w, count, withElite) {
  const pool = enemyPool(sc, li), out = [];
  const gap = Math.max(.9, 1.7 - .02 * diff);
  let t = 1.2, n = count;
  while (n > 0) {
    const p = r();
    if (p < .4 || n === 1) { out.push({ t, lane: r() * 3 | 0, type: pickW(r, pool) }); n--; t += gap; }
    else if (p < .65) { // 混编纵队：同一道前后不同兵种
      const lane = r() * 3 | 0, k = Math.min(n, 2 + (r() < .4 + diff * .01 ? 1 : 0));
      for (let i = 0; i < k; i++) out.push({ t: t + i * .55, lane, type: pickW(r, pool) });
      n -= k; t += gap * (1 + k * .45);
    } else if (p < .85) { // 三道齐进
      const k = Math.min(n, 3), lanes = [0, 1, 2].sort(() => r() - .5);
      const same = r() < .5 ? pickW(r, pool) : null;
      for (let i = 0; i < k; i++) out.push({ t: t + i * .15, lane: lanes[i], type: same || pickW(r, pool) });
      n -= k; t += gap * 1.9;
    } else { // 两侧夹击
      const k = Math.min(n, 2);
      out.push({ t, lane: 0, type: pickW(r, pool) });
      if (k > 1) out.push({ t: t + .1, lane: 2, type: pickW(r, pool) });
      n -= k; t += gap * 1.5;
    }
  }
  if (withElite) {
    const types = ['spear', 'cav', 'bow'];
    if (pool.shield && r() < .3) types.push('shield');
    if (pool.undead && r() < .5) types.push('undead');
    out.push({ t: t + .6, lane: r() * 3 | 0, type: types[r() * types.length | 0], elite: true });
  }
  return out.sort((a, b) => a.t - b.t);
}
function estimateScore(waves, boss, hpMul) {
  let s = 0;
  waves.forEach(w => w.forEach(e => { s += ENEMY[e.type].score * (e.elite ? 5 : 1) + ENEMY[e.type].hp * hpMul * (e.elite ? 4 : 1) * 4; }));
  if (boss) s += 5000 + boss.phases.length * 600;
  return s;
}
function genLevel(idx) {
  const sc = idx / 8 | 0, li = idx % 8, r = mulberry(idx * 7919 + 17), isBoss = li === 7;
  const nW = isBoss ? 1 : 3 + (li >= 3) + (li >= 6);
  const waves = [];
  for (let w = 0; w < nW; w++) {
    const count = isBoss ? 6 + sc : 5 + li + Math.round(sc * 1.3) + w * 2;
    const elite = !isBoss && ((li >= 2 && w >= 1) || (li >= 1 && w === nW - 1));
    waves.push(genWave(r, idx, sc, li, w, count, elite));
  }
  const hpMul = 1 + .022 * idx;
  const boss = isBoss ? SCENES[sc].boss : null;
  const base = estimateScore(waves, boss, hpMul);
  return {
    idx, sc, li, waves, boss, hpMul, spdMul: 1 + .009 * idx,
    bossSpawn: Math.max(2.6, 3.8 - .03 * idx),
    target: Math.round(base * TARGET_K * (li === 0 ? .75 : 1) / 100) * 100, // 首关无精英，处决分少
    label: `${sc + 1}-${li + 1}`,
  };
}
let TARGET_K = 2.6; // S 级目标分 = 估算分 × 系数（用自动对战机器人校准）

// 无尽模式：每 5 波轮换场景，第 5 波为 Boss
function genEndlessWave(seed, n) {
  const r = mulberry(seed * 31 + n * 977), sc = (n - 1) / 5 % 5 | 0, diff = Math.min(39, 4 + n * 1.4);
  const isBoss = n % 5 === 0;
  return {
    sc, isBoss, boss: isBoss ? SCENES[sc].boss : null,
    spawns: genWave(r, diff, sc, 5, 1, isBoss ? 8 + sc * 2 : 8 + Math.min(18, n), !isBoss && n >= 2),
    hpMul: 1 + .022 * diff, spdMul: 1 + .012 * diff, bossSpawn: Math.max(1.6, 3.6 - .04 * diff), diff,
  };
}

/* ---------- 场景机制 ---------- */
function updateHazard(dt) {
  const m = SCENES[G.sc].mech, H_ = G.hazard;
  if (m === 'sand') {
    const s = G.sand; s.t -= dt;
    if (s.on > 0) { s.on -= dt; s.a = Math.min(1, s.a + dt * 2); if (s.on <= 0) s.t = 16 + Math.random() * 6; }
    else { s.a = Math.max(0, s.a - dt * 1.5); if (s.t <= 0) { s.on = 6; fxText('沙暴来袭!', 360, 380, 44, '#c99a55', 1.2, true); } }
    return;
  }
  G.sand.a = Math.max(0, G.sand.a - dt);
  if (m !== 'fire' && m !== 'crack') { H_.kind = null; return; }
  H_.kind = m;
  if (H_.on > 0) {
    H_.on -= dt;
    if (m === 'fire') {
      H_.tick = (H_.tick || 0) - dt;
      if (H_.tick <= 0) {
        H_.tick = .8;
        if (G.P.lane === H_.lane && G.state !== 'end') { playerHit(); fxText('烫!', laneX(G.P.laneF, PT), laneY(PT) - 240, 30, RED, .6); }
        G.enemies.forEach(e => { if (!e.dead && !e.boss && Math.abs(e.laneF - H_.lane) < .5 && e.t > .1) hitEnemy(e, .6, 'fire', { quiet: true, noCount: true }); });
      }
    }

  } else if (H_.warn > 0) {
    H_.warn -= dt;
    if (H_.warn <= 0) {
      H_.on = m === 'fire' ? 4 : 5;
      if (m === 'crack') {
        SFX.play('boom'); G.shake = 10;
        if (G.P.lane === H_.lane) { const to = H_.lane === 1 ? (Math.random() < .5 ? 0 : 2) : 1; G.P.lane = to; playerHit(); }
        G.enemies.forEach(e => { if (!e.dead && !e.boss && Math.abs(e.laneF - H_.lane) < .5 && e.t > .05 && e.t < .9) { killEnemy(e, 'crack', false, .3); } });
      } else SFX.play('fire');

    H_.t -= dt;
    if (H_.t <= 0) { H_.lane = Math.random() < .5 ? G.P.lane : (Math.random() * 3 | 0); H_.warn = 2; fxText(m === 'fire' ? '火油将燃!' : '地面开裂!', laneX(H_.lane, .6), laneY(.6), 34, RED, 1.2, true); }
  }
}

/* ---------- 主更新 ---------- */
function update(rdt) {
  if (!G || G.paused) return;
  G.rt += rdt;
  if (G.banner) { G.banner.t += rdt; if (G.banner.t > 2.2) G.banner = null; }
  if (G.upg) return;            // 三选一时暂停
  if (G.qte) updateQTE(rdt);
  if (G.qteCool > 0) G.qteCool -= rdt;
  const tsTarget = G.qte && !G.qte.res ? .2 : 1;
  G.ts += (tsTarget - G.ts) * Math.min(1, rdt * (tsTarget < G.ts ? 20 : 5));
  if (G.hitstop > 0) { G.hitstop -= rdt; return updateFx(rdt * .3); }
  const dt = rdt * G.ts;
  G.time += dt; G.stateT += dt;
  G.shake = Math.max(0, G.shake - rdt * 40);
  updateFx(rdt);
  if (G.state === 'end') return;
  if (G.ctrBuff > 0) G.ctrBuff -= dt;
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0 && G.combo > 0) breakCombo(); }

  // 出兵
  if (G.state === 'wave') {
    G.spawnT += dt;
    while (G.spawns.length && G.spawns[0].t <= G.spawnT) spawnEnemy(G.spawns.shift());
    if (G.bossPending && !G.boss && G.spawnT > 1.5) { G.bossPending = false; spawnBoss(); }
    if (!G.spawns.length && !G.bossPending && !G.boss && G.enemies.every(e => e.dead)) waveClear();
  }
  updateHazard(dt);
  if (G.bot) bot(dt);

  // 玩家
  const P = G.P;
  P.laneF += (P.lane - P.laneF) * Math.min(1, dt * (P.slide > 0 ? 7 : 16));
  if (P.swCd > 0) P.swCd -= dt;
  if (P.flinch > 0) P.flinch -= dt;
  if (P.slide > 0) P.slide -= dt;
  if (P.anim > 0) P.anim -= dt;
  if (P.hold >= 0 && !G.qte) { P.hold += rdt; P.charging = P.hold > .35 ? Math.min(1, (P.hold - .35) / .25) : 0; }
  P.atkT -= dt;
  if (P.atkT <= 0 && P.flinch <= 0 && P.slide <= 0 && !G.qte) { const r = playerAttack(); P.atkT = r ? r : .05; }

  // 敌人
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.boss) { updateBoss(e, dt); continue; }
    if (e.stun > 0) { e.stun -= dt; continue; }
    if (e.frz > 0) { e.frz -= dt; continue; }
    if (e.slow > 0) e.slow -= dt;
    let spd = e.spd * (e.slow > 0 ? .5 : 1);
    if (e.type === 'bow' && e.t >= e.stopAt && e.st === 'walk') { e.st = 'shoot'; e.shootT = .6; }
    if (e.st === 'shoot') {
      spd *= .2; e.shootT -= dt;
      if (e.shootT <= 0) { e.shootT = 2.6 - Math.min(1, G.diff * .02); G.proj.push({ k: 'earrow', lane: Math.round(e.laneF), to: P.lane, t: e.t + .02, t0: e.t + .02, spd: .9, enemy: true }); e.tele = .2; e.shots = (e.shots || 0) + 1; if (e.shots >= 3) e.st = 'walk', e.stopAt = 9; }
    }
    if (e.tele > 0) e.tele -= dt;
    if (e.laneChg > 0 && e.t >= e.laneChg) {
      e.laneChg = -1; const opts = [e.lane - 1, e.lane + 1].filter(l => l >= 0 && l <= 2);
      e.laneTo = opts[Math.random() * opts.length | 0]; e.chgT = .5;
    }
    if (e.chgT > 0) { e.chgT -= dt; if (e.chgT <= 0) e.lane = e.laneTo; }
    e.laneF += (e.lane - e.laneF) * Math.min(1, dt * 5);
    e.t += spd * dt;
    // 精英拼刀
    if (e.elite && !G.qte && G.qteCool <= 0 && e.parries < 2 && e.t >= .6 + e.parries * .12) { startQTE('parry', e); continue; }
    // 与玩家接战
    if (Math.abs(e.laneF - P.lane) < .4 && e.t + e.reach >= PT - .06 && e.t < PT) {
      if (P.flinch <= 0) playerHit();
      e.t -= .12; e.stun = .4;
      continue;
    }
    if (e.t >= 1) { e.dead = 1; G.waveDone++; wallDmg(e.elite ? 6 : 3, laneX(e.laneF, 1), laneY(1)); }
  }
  G.enemies = G.enemies.filter(e => !e.dead || e.boss);
  if (G.boss && G.boss.dead) G.boss = null;

  // 投射物
  for (const p of G.proj) {
    if (p.done) continue;
    if (p.k === 'arrow') {
      p.t -= p.spd * dt;
      for (const e of G.enemies) {
        if (e.dead || p.hitS.has(e.id) || Math.abs(e.laneF - p.lane) > .5 || e.st === 'enter' && e.boss) continue;
        if (p.t <= e.t + e.reach && p.t > e.t - .06) { p.hitS.add(e.id); hitEnemy(e, p.dmg, p.cls, { kb: .01, quiet: p.quiet && Math.random() < .7 }); if (p.hitS.size >= p.pierce) { p.done = 1; break; } }
      }
      if (p.t < -.02) p.done = 1;
    } else if (p.k === 'orb') {
      const tg = G.enemies.find(e => e.id === p.tid && !e.dead);
      p.t -= p.spd * dt;
      const goal = tg ? tg.t + tg.reach : -1;
      if (tg) p.lane += (tg.laneF - p.lane) * Math.min(1, dt * 8);
      if (p.t <= goal || p.t < 0) { p.done = 1; if (p.t >= 0) explode(p); }
    } else if (p.k === 'meteor') {
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.h -= dt * 2.4; if (p.h <= 0) { p.done = 1; explode(p); G.shake = 8; }
    } else if (p.k === 'earrow') {
      p.t += p.spd * dt;
      // 斜射向开火时玩家所在战道
      if (p.to !== undefined) p.laneC = p.lane + (p.to - p.lane) * Math.min(1, (p.t - p.t0) / Math.max(.05, PT - p.t0));
      if (Math.abs(P.laneF - (p.laneC ?? p.lane)) < .5 && p.t >= PT - .06 && p.t < PT + .04) { p.done = 1; playerHit(); fxText('中箭!', laneX(P.laneF, PT), laneY(PT) - 250, 28, RED, .6); }
      else if (p.t >= 1) { p.done = 1; fxAdd('poof', laneX(p.to ?? p.lane, 1), laneY(1) - 20, { life: .3, s: .4 }); }
    }
  }
  G.proj = G.proj.filter(p => !p.done);
}

function waveClear() {
  if (G.mode === 'level' && G.wave >= G.nWaves) { endGame(true); return; }
  G.state = 'gap'; G.stateT = 0;
  SFX.play('coin');
  const showUpg = G.mode === 'level' || G.wave % 2 === 1 || G.wave % 5 === 0;
  if (showUpg) openUpgrade(); else setTimeout(() => G && G.state === 'gap' && G.mode !== 'level' && startEndlessWave(G.wave + 1), 900);
}
function openUpgrade() {
  const pool = UPGRADES.filter(u => !(u.id === 'heart' && G.wallMax >= 15));
  const pick = []; while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  G.upg = { list: pick, t: 0 };
  if (G.bot) chooseUpgrade(0);
}
function chooseUpgrade(i) {
  const u = G.upg.list[i]; G.upg = null; G.picks.push(u.id);
  if (u.id === 'heart') { G.wallMax += 3; G.wall = Math.min(G.wallMax, G.wall + 3); }
  else G.mods[u.id]++;
  SFX.play('ui');
  if (G.mode === 'level') nextWave(); else startEndlessWave(G.wave + 1);
}

/* ---------- 结算 ---------- */
function endGame(win) {
  if (G.state === 'end') return;
  G.state = 'end'; G.win = win; G.stateT = 0;
  G.qte = null; G.bossTele = null;
  win ? SFX.play('win') : SFX.play('lose');

function bot(dt) {
  const P = G.P; G.botT = (G.botT || 0) - dt;
  if (G.botT > 0 || G.qte) return;
  G.botT = .18 + Math.random() * .12;
  const live = G.enemies.filter(e => !e.dead && e.t > .02 && e.st !== 'enter');
  if (!live.length) return;
  // 选择威胁最大的战道：最靠近底部的敌人
  const danger = [0, 1, 2].map(l => {
    const es = live.filter(e => Math.round(e.laneF) === l);
    return { l, es, d: es.reduce((m, e) => Math.max(m, e.t + (e.elite ? .2 : 0) + (e.st === 'shoot' ? .3 : 0)), -1) };
  });
  if (G.hazard.on > 0 || G.hazard.warn > 0) danger.forEach(o => { if (o.l === G.hazard.lane) o.d -= 2; });
  danger.sort((a, b) => b.d - a.d);
  const tgtLane = G.boss && danger[0].d < .55 ? Math.round(G.boss.laneF) : danger[0].l;
  if (tgtLane !== P.lane) moveLane(tgtLane > P.lane ? 1 : -1);
  const es = live.filter(e => Math.round(e.laneF) === P.lane).sort((a, b) => b.t - a.t);
  if (es.length) {
    const ty = es[0].type, want = counterOf(ty);
    if (Math.random() < G.botSkill) switchCls(want);
  }
  if (P.energy >= 100) castSkill();
}
function botQTE(q) {
  if (q.botAt === undefined) {
    const r = Math.random(), sk = G.botSkill;
    q.botRes = r < .55 * sk ? 'perfect' : r < .9 * sk ? 'good' : 'miss';
  }
  if (q.kind === 'parry') {
    if (q.botAt === undefined) q.botAt = q.hitT + (q.botRes === 'perfect' ? 0 : q.botRes === 'good' ? q.win * 1.6 : 9);
    if (q.t >= q.botAt) qteInput('tap');
  } else if (q.kind === 'exec') {
    q.botAt = q.botAt || 0;
    if (q.t >= q.botAt) { qteInput('tap'); q.botAt = q.t + (q.botRes === 'miss' ? .2 : .08); }
  } else if (q.kind === 'block') {
    if (q.botAt === undefined) q.botAt = q.botRes === 'perfect' ? .3 : .7;
    if (q.t >= q.botAt) qteInput('swipe', q.botRes === 'miss' ? 'X' : q.dir);

  }
}

    const idx = pg * 8 + i, col = i % 4, row = i / 4 | 0, x = 140 + col * 147, y = cy - 40 + row * 210;
    const open = idx <= SAVE.maxClear + 1, rec = SAVE.lv[idx], boss = i === 7;
    g.save(); g.translate(x, y); g.rotate(((idx * 7) % 5 - 2) * .015);
    const fill = !open ? '#d8d2c4' : boss ? '#ffd0d4' : rec ? '#fff3a8' : '#fff';
    drawSpr(g, spr('lvc' + fill, () => mkSprite(160, 200, 80, 100, SQ, gg => shape(gg, box(-62, -80, 124, 160, 8), { fill, w: 3.5, shadow: true }), 50)), 0, 0, 1);
    T(g, open ? `${pg + 1}-${i + 1}` : '🔒', 0, -30, open ? 36 : 30, { col: boss ? RED : INK });
    if (boss) T(g, 'BOSS', 0, 8, 20, { col: RED });
    for (let k = 0; k < 3; k++) drawSpr(g, fxSpr(rec && rec.stars > k ? 'star' : 'wstar'), -30 + k * 30, 42, .9);
    if (rec && rec.rank) T(g, rec.rank, 46, -62, 28, { col: RED, white: true, ow: 2, rot: .2 });
    g.restore();
    if (open) hit(x - 62, y - 80, 124, 160, () => { closeUI(); startLevel(idx); });
  }
  btn(g, 360, cy + 430, 220, 64, '返回', '#e3c69a', () => { UI = { k: UI.from || 'menu', t: 0 }; }, { size: 28, col: INK, ink: false });
}

/* ---------- 兵器库 ---------- */
function drawArmory(g) {
  dim(g, .6); const cy = VH / 2, c = UI.sel || 'spear';
  notePanel(g, 360, cy, 650, 1080, .006);
  T(g, '兵 器 库', 360, cy - 470, 52);
  g.save(); g.translate(560, cy - 470); drawSpr(g, fxSpr('shard'), -60, 0, .8); T(g, '× ' + SAVE.shards, 10, 2, 32, { col: '#2a58a8' }); g.restore();
  CLS.forEach((k, i) => {
    const x = 140 + i * 147, y = cy - 380, on = k === c;
    g.save(); g.translate(x, y);
    drawSpr(g, spr('arm' + k + (+on), () => mkSprite(150, 110, 75, 55, SQ, gg => shape(gg, box(-60, -40, 120, 80, 8), { fill: on ? C[k] : CL[k], w: on ? 4.5 : 3, shadow: on }), 51)), 0, 0, 1);
    T(g, CLASS_INFO[k].name, 0, 2, 32, { col: on ? '#fff' : CD[k], ink: on, ow: 4 });
    g.restore();
    hit(x - 60, y - 40, 120, 80, () => { UI.sel = k; SFX.play('ui'); });
  });
  // 角色立绘
  g.save(); g.beginPath(); g.rect(70, cy - 320, 580, 210); g.clip();
  g.fillStyle = CL[c]; g.fillRect(70, cy - 320, 580, 210);
  drawSpr(g, unitSpr(c, false, 0), 180, cy - 120, .62);
  g.restore(); g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(70, cy - 320, 580, 210);
  T(g, CLASS_INFO[c].name, 300, cy - 270, 40, { align: 'left', col: CD[c] });
  const cnt = c === 'mage' ? '不参与三角克制 · 专破盾兵/亡灵' : `克 ${ENEMY_NAME[BEATS[c]]} · 被 ${ENEMY_NAME[counterOf(c)]} 克`;
  T(g, cnt, 300, cy - 220, 22, { align: 'left', col: INK });
  T(g, `技能「${CLASS_INFO[c].skill}」${CLASS_INFO[c].skillDesc}`, 300, cy - 180, 20, { align: 'left', col: '#5a4030' });
  T(g, '长按战场蓄力 松手释放', 300, cy - 148, 18, { align: 'left', col: '#8a6a4a' });
  // 武器列表
  WEAPONS[c].forEach((w, i) => {
    const y = cy - 30 + i * 150, un = weaponUnlocked(i), st = SAVE.wep[c].star[i], eq = SAVE.wep[c].eq === i;
    g.save(); g.translate(360, y);
    const fill = eq ? '#fff3a8' : un ? '#fff' : '#ddd6c8';
    drawSpr(g, spr('wcard' + fill, () => mkSprite(620, 160, 310, 80, SQ, gg => shape(gg, box(-280, -62, 560, 124, 8), { fill, w: 3.5, shadow: true }), 52)), 0, 0, 1);
    T(g, w.name, -260, -26, 36, { align: 'left', col: un ? INK : '#999' });
    T(g, un ? w.desc : `通关 ${WEAPON_UNLOCK[i] / 8 + 1 | 0}-8 解锁`, -260, 18, 22, { align: 'left', col: un ? '#5a4030' : '#999' });
    for (let k = 0; k < 5; k++) drawSpr(g, fxSpr(k < st ? 'star' : 'wstar'), -255 + k * 30, 46, .8);
    T(g, `伤害 ×${(w.mul * (1 + .1 * (st - 1))).toFixed(2)}`, 30, -26, 22, { col: RED });
    g.restore();
    if (un) {
      if (!eq) btn(g, 560, y - 22, 130, 52, '装备', '#45bf66', () => { SAVE.wep[c].eq = i; writeSave(); SFX.play('coin'); }, { size: 26 });
      else T(g, '已装备', 560, y - 22, 26, { col: '#23803d' });
      if (st < 5) {
        const cost = STAR_COST[st], ok = SAVE.shards >= cost;
        btn(g, 560, y + 34, 130, 46, `升星 ${cost}魂`, ok ? '#4d8df0' : '#bbb', ok ? () => { SAVE.shards -= cost; SAVE.wep[c].star[i]++; writeSave(); SFX.play('perfect'); } : null, { size: 20 });
      } else T(g, '已满星', 560, y + 34, 22, { col: C.gold, ink: true, ow: 3, drop: false });
    }
  });
  T(g, '击杀精英、Boss 与首次拿星可获得武魂', 360, cy + 430, 22, { col: '#8a6a4a' });
  btn(g, 360, cy + 490, 220, 60, '返回', '#e3c69a', () => { if (UI.from === 'result') { UI = { k: 'result', t: 9, res: UI.res }; } else UI = { k: 'menu', t: 0 }; }, { size: 28, col: INK, ink: false });
}

/* ---------- 成就 ---------- */
function drawAch(g) {
  dim(g, .6); const cy = VH / 2;
  notePanel(g, 360, cy, 620, 1000);
  T(g, '成 就', 360, cy - 430, 54);
  ACHIEVEMENTS.forEach((a, i) => {
    const y = cy - 340 + i * 82, got = SAVE.ach[a.id];
    drawSpr(g, fxSpr(got ? 'star' : 'wstar'), 110, y, 1.4);
    T(g, a.name, 145, y - 14, 30, { align: 'left', col: got ? INK : '#aaa' });
    T(g, a.desc, 145, y + 20, 20, { align: 'left', col: got ? '#5a4030' : '#aaa' });
    if (got) T(g, '达成', 600, y, 24, { col: RED, rot: -.15 });
  });
  btn(g, 360, cy + 420, 220, 64, '返回', '#e3c69a', () => { UI = { k: 'menu', t: 0 }; }, { size: 28, col: INK, ink: false });
}

/* ---------- 结算 ---------- */
function drawResult(g) {
  const r = UI.res; UI.t += 1 / 60;
  dim(g, .4);
  const cy = VH / 2, t = UI.t;
  notePanel(g, 360, cy - 30, 640, 1040);
  const title = r.mode === 'level' ? `${r.label} ${r.sname}` : r.sname;
  T(g, title, 360, cy - 500, 36, { col: '#a06a2a' });
  if (r.mode === 'level') {
    T(g, r.win ? '通关!' : '城破…', 360, cy - 420, 96, { col: r.win ? '#ff8a3c' : '#888', ink: true, white: true, ow: 8, rot: -.04 });
    if (r.win) {
      [[-140, 25, 52], [0, 0, 66], [140, 25, 52]].forEach(([dx, dy, rr], i) => {
        const k = Math.min(1, Math.max(0, (t - .3 - i * .25) * 5));
        if (i < r.stars) { g.save(); g.translate(360 + dx, cy - 300 + dy); g.scale(.4 + k * .6 + (k < 1 ? .3 * k : 0), .4 + k * .6); g.globalAlpha = k; drawSpr(g, bigStar(true), 0, 0, rr / 52); g.restore(); g.globalAlpha = 1; }
        else drawSpr(g, bigStar(false), 360 + dx, cy - 300 + dy, rr / 52);
      });
      // 评级印章
      const k = Math.min(1, Math.max(0, (t - 1.1) * 4));
      if (k > 0) {
        g.save(); g.translate(360, cy - 140); g.rotate(-.14); const s = 1 + (1 - k) * 1.2; g.scale(s, s); g.globalAlpha = k * .92;
        drawSpr(g, stampSpr(), 0, 0, 1);
        T(g, r.rank, 0, 6, 140, { col: RED });
        g.restore(); g.globalAlpha = 1;
        if (k === 1 && !UI.stamped) { UI.stamped = 1; SFX.play('boom'); }
      }
      T(g, r.rank === 'S' ? '完美! 已达 S 级' : (r.gapS > 0 ? `距 S 级还差 ${r.gapS.toLocaleString()} 分!` : '克制率达 85% 即可评 S!'), 360, cy - 10, 34, { col: RED, rot: -.02 });
    } else {
      T(g, '城墙被攻破了', 360, cy - 300, 36, { col: '#5a4030' });
      T(g, `距 S 级目标还差 ${Math.max(0, r.gapS).toLocaleString()} 分`, 360, cy - 230, 28, { col: RED });
      drawSpr(g, unitSpr('spear', true, 0), 360, cy - 30, .6);
    }
  } else {
    T(g, '战斗结束', 360, cy - 420, 80, { col: '#ff8a3c', ink: true, white: true, ow: 8, rot: -.04 });
    T(g, `坚持到 第 ${r.wave} 波`, 360, cy - 300, 44, { col: INK });
    T(g, r.newBest ? '新纪录!' : `最佳 ${r.prevBest.toLocaleString()}`, 360, cy - 220, 36, { col: RED });
  }
  const rows = [
    ['克制命中率', Math.round(r.ctrRate * 100) + '%' + (r.mode === 'level' && r.ctrRate < .85 ? ' (S需85%)' : ''), r.ctrRate < .85],
    ['最高连击', r.maxCombo + ''], ['QTE 完美', `${r.perfects} / ${r.qteN}`], ['击败敌人', r.kills + ''],
    ['获得武魂', '+' + r.shards],
  ];
  rows.forEach(([a, b, red], i) => {
    const y = cy + 50 + i * 52;
    T(g, a, 110, y, 28, { align: 'left' }); T(g, b, 610, y, 28, { align: 'right', col: red ? RED : INK });
  });
  const tot = Math.min(r.score, Math.round(r.score * Math.min(1, t / 1.2)));
  g.fillStyle = 'rgba(255,215,60,.75)'; g.fillRect(150, cy + 318, 420, 66);
  T(g, '总分 ' + tot.toLocaleString(), 360, cy + 352, 54);
  if (r.newBest && r.mode === 'level' && r.prevBest > 0) { g.save(); g.translate(600, cy + 320); g.rotate(.2); drawSpr(g, spr('nrec', () => mkSprite(150, 100, 75, 50, SQ, gg => shape(gg, burstPts(0, 0, 66, 40, 11, .8), { fill: RED, w: 3.5, seg: 99 }), 60)), 0, 0, 1); T(g, '新纪录!', 0, 2, 24, { col: '#fff' }); g.restore(); }
  T(g, r.mode === 'level' ? `本关最佳 ${Math.max(r.prevBest, r.score).toLocaleString()}` : '', 360, cy + 405, 22, { col: '#888' });
  if (r.unlockW) T(g, `解锁新武器! 去兵器库看看`, 360, cy + 440, 26, { col: '#4d8df0' });
  else if (r.newAch.length) T(g, '成就达成: ' + r.newAch.map(id => ACHIEVEMENTS.find(a => a.id === id).name).join(' '), 360, cy + 440, 24, { col: '#a06a2a' });
  // 按钮
  const by = Math.min(VH - 80, cy + 560);
  btn(g, 250, by, 400, 104, '再来一次', '#ff8a3c', () => { SFX.play('ui'); UI = null; restart(); }, { size: 50, rot: -.02 });
  const canNext = r.mode === 'level' && r.win && r.idx < 39;
  btn(g, 575, by, 200, 96, canNext ? '下一关→' : '菜单', '#e3c69a', () => {
    SFX.play('ui');
    if (canNext) { UI = null; startLevel(r.idx + 1); } else UI = { k: 'menu', t: 0, fromResult: true };
  }, { size: 32, col: INK, ink: false, rot: .03 });
  btn(g, 600, cy - 500, 120, 50, '兵器库', '#a66bf0', () => { UI = { k: 'armory', t: 0, from: 'result', sel: G.P.cls, res: r }; }, { size: 22 });
}
function bigStar(on) { return spr('bs' + (+on), () => mkSprite(130, 130, 65, 65, SQ, g => on ? shape(g, starPts(0, 0, 52, 52 * .47), { fill: C.gold, w: 4.5, seg: 99, amp: 1.5, hatch: { col: '#e08a0a99', gap: 6, rect: [0, -52, 52, 104] } }) : shape(g, starPts(0, 0, 52, 52 * .47), { stroke: '#bbb', w: 4, seg: 99, amp: 2, passes: 1 }), 61)); }
function stampSpr() {
  return spr('stamp', () => mkSprite(240, 240, 120, 120, SQ, g => {
    shape(g, ell(0, 0, 104, 104), { stroke: RED, w: 8, amp: 2.5, passes: 1 }); shape(g, ell(0, 0, 88, 88), { stroke: RED, w: 3, amp: 2, passes: 1 });
    T(g, '评 级', 0, -72, 20, { col: RED });
  }, 62));
}

function drawUI(g) {
  if (G && G.upg && !UI) drawUpgrade(g);
  if (!UI) return;
  if (UI.k === 'menu') { if (UI.fromResult) { G.paused = true; } drawMenu(g); }
  else if (UI.k === 'result') drawResult(g);
  else if (UI.k === 'levels') drawLevels(g);
  else if (UI.k === 'armory') drawArmory(g);
  else if (UI.k === 'ach') drawAch(g);
  else if (UI.k === 'modes') drawModes(g);
}

'use strict';
/* ================= 启动 / 画布适配 / 触摸输入 / 主循环 ================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1, lastT = 0, lowFps = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // 逻辑宽固定 720，高按屏幕比例，最少 1280（窄长屏向上延伸），最多 1560
  const ar = h / w;
  VH = Math.round(Math.min(1560, Math.max(1280, 720 * ar)));
  SCALE = Math.min(w / 720, h / VH);
  cv.style.width = Math.round(720 * SCALE) + 'px'; cv.style.height = Math.round(VH * SCALE) + 'px';
  cv.width = Math.round(720 * SCALE * DPR); cv.height = Math.round(VH * SCALE * DPR);
  OY = Math.round((VH - 1280) * .5);
  const sat = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  SAFE_T = Math.round(sat / SCALE);
  const q = Math.min(2, Math.max(.75, SCALE * DPR * (lowFps > 30 ? .75 : 1)));
  if (Math.abs(q - SQ) > .2) { SQ = q; clearSprites(); }
  document.getElementById('rot').style.display = w > h * 1.15 && w > 600 && 'ontouchstart' in window ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ---------- 开局 ---------- */
let lastStart = null;
function startLevel(idx) {
  lastStart = ['level', idx]; newGame('level', idx); SFX.music(true, idx / 8 % 2 | 0); prewarm();
  SAVE.cur = idx; writeSave();
}
function startMode(m) { lastStart = [m, 0]; newGame(m, 0); SFX.music(true, 1); prewarm(); }
function restart() { if (lastStart) lastStart[0] === 'level' ? startLevel(lastStart[1]) : startMode(lastStart[0]); }
listeners.onResult = res => { UI = { k: 'result', t: 0, res }; };
const _closeUI = closeUI;
closeUI = function () { if (G && G.state === 'end' && G.result) { UI = { k: 'result', t: 9, res: G.result }; return; } _closeUI(); };

// 预生成常用精灵，避免战斗中首次出现时卡顿
function prewarm() {
  sceneSpr(SCENES[G.sc].key);
  CLS.forEach(c => { unitSpr(c, false, 0); unitSpr(c, false, 1); });
  ['spear', 'cav', 'bow'].forEach(t => { unitSpr(t, true, 0); unitSpr(t, true, 1); tagSpr(t, false); });
}

/* ---------- 触摸 ---------- */
const touches = new Map();
function toLogic(cx, cy) { const r = cv.getBoundingClientRect(); return [(cx - r.left) / SCALE, (cy - r.top) / SCALE]; }
function findHit(x, y) { for (let i = HIT.length - 1; i >= 0; i--) { const h = HIT[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; } return null; }
function onDown(id, cx, cy) {
  SFX.init();
  const [x, y] = toLogic(cx, cy);
  const h = findHit(x, y);
  touches.set(id, { x0: x, y0: y, x, y, t0: performance.now(), h, swiped: false, field: !h && !UI && G && !G.upg });
  if (h && (h.now || UI || (G && G.upg))) { h.fn(); touches.get(id).used = true; return; }
  if (!G || UI || G.upg) return;
  if (G.qte) { if (G.qte.kind === 'parry' || G.qte.kind === 'exec') qteInput('tap'); touches.get(id).qte = true; return; }
  if (touches.get(id).field && y < VH - 210) G.P.hold = 0;
}
function onMove(id, cx, cy) {
  const t = touches.get(id); if (!t) return;
  const [x, y] = toLogic(cx, cy); t.x = x; t.y = y;
  if (t.used || t.swiped || !G || UI) return;
  const dx = x - t.x0, dy = y - t.y0;
  if (G.qte && G.qte.kind === 'block') {
    if (Math.hypot(dx, dy) > 50) { t.swiped = true; qteInput('swipe', Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); }
    return;
  }
  if (t.qte) return;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * .8) {
    t.swiped = true; G.P.hold = -1; G.P.charging = 0;
    moveLane(dx > 0 ? 1 : -1);
    // 连续滑动：重置起点，可一次划过两道
    t.swiped = false; t.x0 = x; t.y0 = y;
    t.moved = true;
  }
}
function onUp(id) {
  const t = touches.get(id); touches.delete(id); if (!t || !G) return;
  if (t.used || UI) return;
  if (t.h && !t.moved && !t.h.now) { t.h.fn(); return; }
  if (G.P.charging >= 1 && !t.moved) castSkill();
  G.P.hold = -1; G.P.charging = 0;
}
cv.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); for (const t of e.changedTouches) onUp(t.identifier); }, { passive: false });
cv.addEventListener('touchcancel', e => { for (const t of e.changedTouches) touches.delete(t.identifier); if (G) { G.P.hold = -1; G.P.charging = 0; } });
// 桌面调试：鼠标与键盘
let mouseDown = false;
cv.addEventListener('mousedown', e => { mouseDown = true; onDown('m', e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (mouseDown) onMove('m', e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; onUp('m'); } });
window.addEventListener('keydown', e => {
  SFX.init(); if (!G) return;
  const k = e.key;
  if (G.qte) {
    const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' };
    if (G.qte.kind === 'block' && m[k]) qteInput('swipe', m[k]);
    if (k === ' ') qteInput('tap');
  }
  if (k === 'ArrowLeft' || k === 'a') moveLane(-1);
  if (k === 'ArrowRight' || k === 'd') moveLane(1);
  if ('1234'.includes(k) && k.length === 1) { const c = CLS[+k - 1]; if (G.qte && G.qte.kind === 'choice') qteInput('cls', c); else switchCls(c); }
  if (k === 'e' || k === 'Enter') castSkill();
  if (k === 'Escape') UI ? closeUI() : openMenu();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !UI && G.state !== 'end') openMenu(); SFX.music(!document.hidden && !!G); });
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- 主循环 ---------- */
let fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now - (lastT || now)) / 1000); lastT = now;
  fpsAcc += rdt; fpsN++;
  if (fpsAcc > 2) { const fps = fpsN / fpsAcc; if (fps < 40) lowFps++; else lowFps = Math.max(0, lowFps - 1); fpsAcc = 0; fpsN = 0; }
  if (G && !UI) update(rdt);
  else if (G && UI && G.state === 'end') update(rdt);
  render();
}
function render() {
  const g = ctx;
  g.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  g.imageSmoothingQuality = 'medium';
  HIT = [];
  if (!G) return;
  g.fillStyle = '#2a241e'; g.fillRect(0, 0, 720, VH);
  drawWorld(g);
  g.save(); g.translate(0, 0);
  drawHUD(g);
  drawBanner(g);
  drawQTE(g);
  drawUI(g);
  g.restore();
}

/* ---------- 启动：直接开局 ---------- */
function boot() {
  loadSave(); SFX.setMuted(!!SAVE.muted);
  resize();
  const idx = Math.min(39, Math.max(0, Math.min(SAVE.cur, SAVE.maxClear + 1)));
  startLevel(idx);
  const ld = document.getElementById('ld'); if (ld) ld.remove();
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('30px BFKL'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot, boot);

</script>
