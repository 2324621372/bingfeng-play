'use strict';
/* ================= 助战战兽：偏写实、凶猛的涂鸦动物（侧身朝左，脚底为原点） =================
 * 画法：真实比例（小头、长身、关节腿）+ 粗墨线 + 下腹排线阴影 + 怒目獠牙；我军统一佩红色披挂，与敌方动物区分
 */
const ARMY = '#e23b2e', ARMY_D = '#a8261c';
// 战兽营卡片 [缩放, 脚底下移]；HUD 头像以头部为中心 [头 x, 头 y, 缩放]
const SPIRIT_CARD = { hound: [.62, 52], bull: [.56, 50], falcon: [.6, 62], pigeon: [.66, 58], elephant: [.44, 54], bees: [.9, 48], steed: [.5, 54], blackbear: [.5, 52], raven: [.62, 60], lion: [.58, 50], wolfdog: [.6, 50], camel: [.48, 54] };
const SPIRIT_HEAD = { hound: [-78, -100, .9], bull: [-82, -64, .82], falcon: [-40, -122, 1.05], pigeon: [-34, -96, 1.1], elephant: [-84, -122, .6], bees: [-22, -70, 1.1], steed: [-80, -150, .8], blackbear: [-30, -168, .82], raven: [-36, -110, 1.05], lion: [-74, -100, .7], wolfdog: [-70, -96, .72], camel: [-92, -170, .86] };

/* ---------- 通用部件 ---------- */
function beastShadow(g, rx) { shape(g, ell(0, 2, rx, rx * .2), { fill: 'rgba(60,40,20,.25)', stroke: false, off: 0 }); }
// 关节腿：墨线外描 + 填色
function limb(g, pts, w, c) { ln(g, pts, { stroke: INK, w: w + 5, passes: 1, amp: .4 }); ln(g, pts, { stroke: c, w, passes: 1, amp: .3 }); }
// 躯干：下半部排线做腹部阴影
function torso(g, pts, c, dk, w = 4.5) {
  const [x, y, bw, bh] = bbox(pts);
  shape(g, pts, { fill: c, w, seg: 24, hatch: { col: dk + '99', gap: 5, w: 1.6, rect: [x, y + bh * .55, bw, bh * .5] } });
}
function hoof(g, x, w, c = INK) { shape(g, box(x - w / 2 - 1, -8, w + 2, 9, 2), { fill: c, w: 2.2, passes: 1 }); }
function paw(g, x, y, r, c) { shape(g, ell(x, y, r * 1.2, r * .7), { fill: c, w: 3 }); [-1, 0, 1].forEach(k => ln(g, [[x - r + k * r * .55, y + r * .2], [x - r * 1.5 + k * r * .55, y + r * .8]], { w: 2, passes: 1, seg: 99 })); }

// 侧脸怒目（朝左）：杏眼 + 压低的眉
function sEye(g, x, y, r, iris) {

  ln(g, [[x - r * 1.7, y - r * .5], [x + r * 1.6, y - r * 1.5]], { w: Math.max(2.6, r * .75), seg: 99, passes: 1 });

// 正脸怒目（一对），眉头压向中间
function fEyes(g, cx, cy, dx, r, iris, glowCol) {
  [-1, 1].forEach(sd => {

function fang(g, x, y, len, dir = 1, w = 3) { shape(g, [[x - w, y], [x, y + dir * len], [x + w, y]], { fill: '#fffaf0', w: 1.8, seg: 99, passes: 1 }); }

  shape(g, pts, { fill: ARMY, w: 3.5, seg: 99, hatch: { col: 'rgba(0,0,0,.2)', gap: 5 } });
  const n = pts.length; ln(g, [pts[n - 1], pts[n - 2]], { stroke: C.gold, w: 4, passes: 1, seg: 99 });

}

/* ---------- 侧身飞禽（猎鹰 / 信鸽 / 渡鸦） ---------- */

  if (o.carry) o.carry(-8, y0 + 34);

  const wy = up * 18; // 扇动：上扬 / 下压

  shape(g, fl(wing), { fill: o.wingN, w: 4, seg: 99, hatch: { col: o.dk + '99', gap: 5 } });

  [[30, -60, 82, -90], [36, -54, 86, -74], [34, -44, 82, -58], [28, -36, 70, -42]].forEach(([x1, y1, x2, y2], i) => ln(g, fl([[x1, y0 + y1 - wy * (.7 - i * .12)], [x2, y0 + y2 - wy * (1.2 - i * .2)]]), { stroke: o.dk, w: 1.8, passes: 1, seg: 99 }));
  if (o.wingBars) [[4, -44], [18, -38]].forEach(([x, y]) => ln(g, fl([[x - 8, y0 + y - wy * .5], [x + 16, y0 + y - wy * .4 + 4]]), { stroke: INK, w: 4, passes: 1, seg: 99 }));
  // 头 + 喙 + 怒目

// 可复现的关卡随机数
function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pickW(r, w) {
  let s = 0; for (const k in w) s += w[k];
  let x = r() * s; for (const k in w) { x -= w[k]; if (x <= 0) return k; }
  return Object.keys(w)[0];
}
// 各场景敌人池：基础三兵种 + 场景特色（动物 / 特殊兵），按关内序号逐步加入
function enemyPool(sc, li) {
  const w = { spear: 1, cav: 1, bow: li === 0 && sc === 0 ? .4 : 1 };
  const add = (k, v, minLi = 0) => { if (li >= minLi) w[k] = v; };
  if (sc === 0) { add('wolf', .3, 3); add('drummer', .2, 5); }
  if (sc === 1) { add('boar', .55); add('wolf', .4); add('healer', .25, 2); add('assassin', .3, 4); }
  if (sc === 2) { add('scorpion', .55); add('shield', .3, 2); add('bomber', .3, 3); add('drummer', .2, 5); }
  if (sc === 3) { add('wolf', .3); add('bear', .25, 1); add('shield', .35); add('giant', .18, 3); add('healer', .2, 4); }
  if (sc === 4) { add('undead', .45); add('bat', .45); add('assassin', .3, 2); add('drummer', .2, 3); add('shield', .25); }
  if (sc === 5) { add('salamander', .5); add('undead', .3); add('giant', .2); add('bomber', .3); add('shield', .3); add('bat', .25, 3); }
  if (sc === 6) { add('crab', .5); add('croc', .45); add('eagle', .3, 1); add('bomber', .2, 3); add('healer', .2, 4); add('wolf', .2, 5); }
  if (sc === 7) { add('armor', .45); add('catapult', .25, 1); add('eagle', .3); add('giant', .18, 3); add('assassin', .25); add('drummer', .2, 2); add('shield', .25); add('undead', .2, 4); }
  return w;
}

// 生成一波：difficulty 0..40，返回按时间排序的出兵表
function genWave(r, diff, sc, li, w, count, withElite) {
  const pool = enemyPool(sc, li), out = [];
  const gap = Math.max(.9, 1.7 - .02 * diff);
  // 狼成群出现：一只变 2~3 只，分散到相邻战道
  const put = (t, lane, type) => {
    out.push({ t, lane, type });
    if (type !== 'wolf') return 1;
    const k = 1 + (r() < .5 ? 1 : 0);
    for (let i = 1; i <= k; i++) out.push({ t: t + i * .35, lane: (lane + i) % 3, type });
    return k + 1;
  };
  let t = 1.2, n = count;
  while (n > 0) {
    const p = r();
    if (p < .4 || n === 1) { n -= put(t, r() * 3 | 0, pickW(r, pool)); t += gap; }
    else if (p < .65) { // 混编纵队：同一道前后不同兵种
      const lane = r() * 3 | 0, k = Math.min(n, 2 + (r() < .4 + diff * .01 ? 1 : 0));
      for (let i = 0; i < k; i++) out.push({ t: t + i * .55, lane, type: pickW(r, pool) });
      n -= k; t += gap * (1 + k * .45);
    } else if (p < .85) { // 三道齐进
      const k = Math.min(n, 3), lanes = [0, 1, 2].sort(() => r() - .5);
      const same = r() < .5 ? pickW(r, pool) : null;
      for (let i = 0; i < k; i++) out.push({ t: t + i * .15, lane: lanes[i], type: same || pickW(r, pool) });
      n -= k; t += gap * 1.9;
    } else { // 两侧夹击
      const k = Math.min(n, 2);
      out.push({ t, lane: 0, type: pickW(r, pool) });
      if (k > 1) out.push({ t: t + .1, lane: 2, type: pickW(r, pool) });
      n -= k; t += gap * 1.5;
    }
  }
  if (withElite) {
    const types = Object.keys(pool).filter(k => !['bat', 'wolf', 'bomber', 'giant', 'bear', 'eagle', 'catapult', 'armor'].includes(k));
    out.push({ t: t + .6, lane: r() * 3 | 0, type: types[r() * types.length | 0], elite: true });
  }
  return out.sort((a, b) => a.t - b.t);
}
function estimateScore(waves, boss, hpMul) {
  let s = 0;
  waves.forEach(w => w.forEach(e => { s += ENEMY[e.type].score * (e.elite ? 5 : 1) + ENEMY[e.type].hp * hpMul * (e.elite ? 4 : 1) * 4; }));
  if (boss) s += 5000 + boss.phases.length * 600;
  return s;
}
function genLevel(idx) {
  const sc = idx / 8 | 0, li = idx % 8, r = mulberry(idx * 7919 + 17), isBoss = li === 7;
  const D = idx * 40 / NLV; // 难度统一折算到 0..40，场景数变化不影响曲线
  const nW = isBoss ? 1 : 3 + (li >= 3) + (li >= 6);
  const waves = [], envs = [];
  for (let w = 0; w < nW; w++) {
    const sk = Math.min(sc, 5); // 波次规模在 6 区之后不再增长，难度靠新敌人与机制
    const count = isBoss ? 6 + Math.round(sk * .85) : 5 + li + Math.round(sk * 1.05) + w * 2;
    const elite = !isBoss && ((li >= 2 && w >= 1) || (li >= 1 && w === nW - 1));
    waves.push(genWave(r, D, sc, li, w, count, elite));
    envs.push(SCENES[sc].env[(w + li) % 3]);
  }
  const hpMul = 1 + .022 * D;
  const boss = isBoss ? SCENES[sc].boss : null;
  const base = estimateScore(waves, boss, hpMul);
  return {
    idx, sc, li, waves, envs, boss, hpMul, spdMul: 1 + .009 * D, diff: D,
    bossSpawn: Math.max(2.6, 3.8 - .03 * D),
    target: Math.round(base * TARGET_K * (li === 0 ? .75 : 1) * (sc >= 6 ? .72 : 1) / 100) * 100, // 首关无精英，处决分少
    label: `${sc + 1}-${li + 1}`,
  };
}

// 无尽模式：每 5 波轮换场景，第 5 波为 Boss
function genEndlessWave(seed, n) {
  const r = mulberry(seed * 31 + n * 977), sc = (n - 1) / 5 % SCENES.length | 0, diff = Math.min(39, 4 + n * 1.4);
  const isBoss = n % 5 === 0;

  e.dead = 1; G.kills++; G.waveDone++;
  G.spE = Math.min(100, G.spE + (e.elite ? 20 : 7));
  const sc = ENEMY[e.type].score * (e.elite ? 5 : 1) * comboMul() * (ctr ? 1.5 : 1) * bonus * (1 + G.mods.score * .15) * (G.buf.pig > 0 ? 2 : 1);
  G.score += Math.round(sc);
  const ex = laneX(e.laneF, e.t), ey = laneY(e.t) - 70 * depthS(e.t);
  fxAdd('poof', ex, ey, { life: .45, s: .6 * depthS(e.t) * (e.elite ? 1.4 : 1), grow: .5 });
  for (let i = 0; i < (e.elite ? 7 : 3); i++) fxAdd(i % 2 ? 'star' : 'wstar', ex, ey, { life: .6, s: .8, vx: (Math.random() - .5) * 400, vy: -150 - Math.random() * 250, g: 900, rot: Math.random() * 6, vr: 8 });
  fxText('+' + Math.round(sc), ex, ey - 50, e.elite ? 34 : 26, C.gold, .8, true);
  SFX.play('kill');
  if (e.type === 'bomber') bomberBlast(e, false);
  dropWeapon(e, ex, ey);
  if (G.buf.pig > 0 && !e.elite && Math.random() < .2) { G.shardsGot++; fxAdd('shard', ex, ey, { life: 1.1, s: .7, vx: (Math.random() - .5) * 200, vy: -300, g: 600, toHud: true }); }
  if (e.elite && !e.boss) {
    const n = 1 + (Math.random() < .35 ? 1 : 0); G.shardsGot += n;
    for (let i = 0; i < n; i++) fxAdd('shard', ex, ey, { life: 1.1, s: .8, vx: (Math.random() - .5) * 200, vy: -300, g: 600, toHud: true });
    G.shake = 8;
  }
}

function bomberBlast(e, self) {
  const x = laneX(e.laneF, e.t), y = laneY(e.t);
  fxAdd('boom', x, y - 40, { life: .4, s: depthS(e.t) * 1.3, col: '#ffb36b' }); SFX.play('boom'); G.shake = Math.max(G.shake, 10);
  G.enemies.forEach(o => { if (o !== e && !o.dead && !o.boss && Math.abs(o.laneF - e.laneF) < 1.2 && Math.abs(o.t - e.t) < .12) hitEnemy(o, 2.5, 'blast', { quiet: true, noCount: true }); });
  if (self) { playerHit(1.1); fxText('炸到了!', x, y - 240, 34, RED, .8, true); }
}

/* ---------- 兵器掉落 ---------- */
function rollIdx(tab) { let r = Math.random() * tab.reduce((a, b) => a + b, 0); for (let i = 0; i < tab.length; i++) if ((r -= tab[i]) < 0) return i; return 0; }
function dropWeapon(e, x, y) {
  const D = DROP[e.boss ? 'b' : e.elite ? 'e' : 'n'];
  if (Math.random() >= D.p || G.drops.length >= 8) return;
  const open = CLS.filter(clsOpen), own = WEP_CLS[e.type];
  // 人形敌人掉自己手里那把；动物随机兵种
  const c = own && open.includes(own) ? own : open[Math.random() * open.length | 0];
  const wi = own === c && e.wi > 0 ? e.wi : rollIdx(D.w), q = rollIdx(D.q);
  giveWeapon(c, wi, q, x, y);
}
function giveWeapon(c, wi, q, x, y) {
  const w = SAVE.wep[c], up = q > qualOf(c, wi);
  if (up) w.q[wi] = q; else G.shardsGot += q + 1; // 重复或更低品质：折算成武魂
  G.drops.push({ c, wi, q, up });
  writeSave();
  fxAdd('wdrop', x, y, { life: 1.9, s: 1, vy: -110, g: 90, c, wi, q });
  fxText(QUALITY[q].name + '·' + WEAPONS[c][wi].name + (up ? '' : ' 武魂+' + (q + 1)), x, y - 76, q >= 3 ? 26 : 22, QUALITY[q].col, 1.7, true);
  SFX.play(q >= 3 ? 'perfect' : 'coin');
}

/* ---------- Boss ---------- */
function bossHpCheck(b, cls) {
  const segFloor = b.seg * (b.phases.length - 1 - b.pi);
  if (b.hp <= segFloor && b.pi < b.phases.length - 1) {
    b.hp = segFloor; b.inv = 1.2; b.pi++;
    G.shake = 12; SFX.play('boom');
    fxText('破阵!', laneX(b.laneF, b.t), laneY(b.t) - 330, 60, '#fff', 1, true);
    if (!G.qte) startQTE('choice', b); else b.type = b.phases[b.pi];
  } else if (b.hp <= 0) {
    b.hp = .01;
    if (!G.qte) startQTE('exec', b);
  }
}
function updateBoss(b, dt) {
  if (b.inv > 0) b.inv -= dt;
  if (b.st === 'enter') { b.t += dt * .12; if (b.t >= .5) { b.t = .5; b.st = 'fight'; } return; }
  if (b.stun > 0) { b.stun -= dt; return; }
  b.moveT -= dt;
  if (b.moveT <= 0 && !G.bossTele) { b.laneTo = Math.random() < .6 ? G.P.lane : (Math.random() * 3 | 0); b.moveT = 4 + Math.random() * 3; }
  b.laneF += (b.laneTo - b.laneF) * Math.min(1, dt * 4);
  // 召唤
  G.bossSpawnT -= dt;
  if (G.bossSpawnT <= 0) {
    G.bossSpawnT = G.bossInt * (1.1 - b.pi * .08) * Math.max(1, b.phases.length / 3.2); // 阶段多的 Boss 召唤更慢
    const tps = ['spear', 'cav', 'bow'];
    const ty = Math.random() < .45 && !['shield', 'armor', 'giant'].includes(b.type) ? b.type : tps[Math.random() * 3 | 0];
    const lanes = [0, 1, 2].filter(l => l !== Math.round(b.laneF));
    spawnEnemy({ type: ty, lane: lanes[Math.random() * lanes.length | 0], t0: .3 }); G.waveTotal++;
  }
  // 蓄力重击
  if (!G.bossTele) {
    G.bossAtkT -= dt;
    if (G.bossAtkT <= 0 && !G.qte) { G.bossTele = { lane: G.P.lane, t: 0, dur: 1.1 }; b.laneTo = G.P.lane; SFX.play('qte'); }
  } else {
    G.bossTele.t += dt;
    if (G.bossTele.t >= G.bossTele.dur) {
      if (!G.qte) { startQTE('block', b); G.bossTele = null; G.bossAtkT = Math.max(4.5, 8 - b.pi * .8 - G.diff * .05); }
    }
  }
}

/* ---------- QTE ---------- */
function qteWin() { return Math.max(.08, .12 - G.diff * .0012) + G.mods.qte * .04; }
function startQTE(kind, target) {
  const q = { kind, target, t: 0, res: null, resT: 0 };
  if (kind === 'parry') { q.hitT = .8; q.win = qteWin(); q.dur = q.hitT + q.win * 2.4; }
  if (kind === 'exec') { q.need = Math.min(16, 9 + (G.diff / 5 | 0)); q.taps = 0; q.dur = 1.7 + G.mods.qte * .2; }
  if (kind === 'block') { q.dir = ['L', 'R', 'U', 'D'][Math.random() * 4 | 0]; q.dur = 1.15 + G.mods.qte * .3; }
  if (kind === 'choice') { q.next = target.phases[target.pi]; q.ans = counterOf(q.next); q.dur = 1.3 + G.mods.qte * .3; target.type = q.next; }
  G.qte = q; G.qteN++; G.P.hold = -1; G.P.charging = 0;
  if (kind === 'parry' || kind === 'exec') {
    if (target && !target.boss) { const l = Math.round(target.laneF); if (G.P.lane !== l) { G.P.lane = l; fxAdd('poof', laneX(G.P.laneF, PT), laneY(PT) - 60, { life: .3, s: .5 }); } }
  }
  SFX.play('qte'); SFX.vibrate(30);
}
function qteInput(kind, v) {
  const q = G.qte; if (!q || q.res) return;
  if (q.kind === 'parry' && kind === 'tap') {
    const d = Math.abs(q.t - q.hitT);
    qteResolve(d <= q.win ? 'perfect' : d <= q.win * 2.4 ? 'good' : 'miss');
  } else if (q.kind === 'exec' && kind === 'tap') {
    q.taps++; SFX.play('tap'); G.shake = 3;
    fxAdd('hit', 360 + (Math.random() - .5) * 200, 700 + (Math.random() - .5) * 200, { life: .2, s: .5, ui: true });
    if (q.taps >= q.need) qteResolve(q.t < q.dur * .6 ? 'perfect' : 'good');
  } else if (q.kind === 'block' && kind === 'swipe') {
    qteResolve(v === q.dir ? (q.t < q.dur * .55 ? 'perfect' : 'good') : 'miss');
  } else if (q.kind === 'choice' && kind === 'cls') {
    qteResolve(v === q.ans ? 'perfect' : 'miss'); switchCls(v, true);
  }
}
function qteResolve(r) {
  const q = G.qte; q.res = r; q.resT = 0;
  const e = q.target;
  if (r === 'perfect') { G.perfects++; SFX.play('perfect'); SFX.vibrate(40); G.score += Math.round(500 * comboMul()); addCombo(); }
  else if (r === 'good') { SFX.play('good'); G.score += Math.round(200 * comboMul()); addCombo(); }
  else { SFX.play('miss'); SFX.vibrate([60, 40, 60]); }
  if (q.kind === 'parry') {
    if (r === 'miss') { playerHit(); e.t = Math.max(0, e.t - .06); }
    else { hitEnemy(e, e.maxHp * (r === 'perfect' ? .42 : .2) / 1, 'qte', { noCount: true, quiet: true }); e.t = Math.max(0, e.t - (r === 'perfect' ? .16 : .09)); e.stun = r === 'perfect' ? 2 : .8; G.shake = 10; }
    e.parries++;
  } else if (q.kind === 'exec') {
    if (r !== 'miss') {
      e.execd = true; SAVE.st.exec = (SAVE.st.exec || 0) + 1;
      if (e.boss) { e.hp = 0; bossDie(e); }
      else killEnemy(e, 'qte', true, 3);
      G.shake = 16;
    } else {
      if (e.boss) { e.hp = e.seg * .12; }
      else { e.execd = true; e.hp = Math.max(.01, e.hp); }
    }
  } else if (q.kind === 'block') {
    if (r === 'miss') { playerHit(); wallDmg(2, laneX(G.P.laneF, PT), laneY(PT)); }
    else { e.stun = r === 'perfect' ? 2.4 : 1.4; e.hp -= e.seg * (r === 'perfect' ? .12 : .06); bossHpCheck(e, 'qte'); G.shake = 12; SFX.play('clink'); }
  } else if (q.kind === 'choice') {
    if (r !== 'miss') G.ctrBuff = 5;
  }
}
function bossDie(b) {
  b.dead = 1; G.waveDone++; G.kills++;
  const sc = Math.round((5000 + b.phases.length * 800) * comboMul() * (1 + G.mods.score * .15));
  G.score += sc; G.shardsGot += 5;
  const x = laneX(b.laneF, b.t), y = laneY(b.t) - 160;
  for (let i = 0; i < 16; i++) fxAdd(i % 3 ? 'star' : 'wstar', x, y, { life: 1.2, s: 1.2, vx: (Math.random() - .5) * 700, vy: -200 - Math.random() * 500, g: 900, rot: Math.random() * 6, vr: 6 });
  for (let i = 0; i < 5; i++) fxAdd('shard', x, y, { life: 1.3, s: .9, vx: (Math.random() - .5) * 300, vy: -400, g: 700, toHud: true });
  dropWeapon(b, x, y - 40);
  fxAdd('poof', x, y, { life: .8, s: 1.8, grow: .8 });
  fxText('+' + sc, x, y - 120, 50, C.gold, 1.4, true);
  G.enemies.forEach(e => { if (!e.dead && !e.boss) killEnemy(e, 'qte', false); });
  G.boss = null; G.bossTele = null; SFX.play('boom');
}
function updateQTE(rdt) {
  const q = G.qte;
  if (q.res) {
    q.resT += rdt;
    if (q.resT > .55) { G.qte = null; G.qteCool = 1.2; }
    return;
  }
  q.t += rdt;
  if (G.bot) botQTE(q);
  if (q.t >= q.dur && !q.res) {
    if (q.kind === 'exec') qteResolve(q.taps >= q.need * .7 && !q.target.boss ? 'good' : 'miss');
    else qteResolve('miss');
  }
}

/* ---------- 玩家 ---------- */
function playerHit(dur = .55) {
  const P = G.P; if (P.flinch > 0) return;
  if (G.buf.wool > 0) { if (!G.woolFx || G.time - G.woolFx > .6) { G.woolFx = G.time; fxText('黑熊挡下了!', laneX(P.laneF, PT), laneY(PT) - 260, 28, '#fff', .6, true); } return; }
  P.flinch = dur; breakCombo(); G.shake = 9; SFX.play('hurt'); SFX.vibrate(50);
  fxAdd('hit', laneX(P.laneF, PT), laneY(PT) - 100, { life: .3, s: .8 });
}
function wallDmg(n, x, y) {
  if (DBG.god) return; // 调试无敌：城墙不掉血
  G.wall = Math.max(0, G.wall - n); G.wallLost += n; breakCombo(); G.shake = 12; SFX.play('wall'); SFX.vibrate(80);
  fxAdd('smoke', x, y, { life: .6, s: .9, grow: .5 });
  fxText(n >= 3 ? '城墙 -1♥' : '城墙受损', x, y - 60, 30, RED, .9, true);
  if (G.wall <= 0) endGame(false);
}
function moveLane(d) {
  const P = G.P;
  if (G.qte || G.state === 'end') return;
  let to = P.lane + d;
  if (to < 0 || to > 2) return;
  if (G.hazard.kind === 'crack' && G.hazard.on > 0 && G.hazard.lane === to) { to += d; if (to < 0 || to > 2) { fxText('地裂!', laneX(P.lane + d, PT), laneY(PT) - 200, 30, RED, .6); return; } }
  P.lane = to; SFX.play('swipe');
  if (SCENES[G.sc].mech === 'ice') { P.slide = envOf().slide || .32; }
  tutDone('lane');
}
function switchCls(c, free) {
  const P = G.P;
  if (P.cls === c || (!free && P.swCd > 0) || G.state === 'end') return;
  if (!clsOpen(c)) { fxText(`通关 ${lvLabel(CLS_UNLOCK[c])} 解锁${CLASS_INFO[c].name}`, 360, VH - 300 - OY, 26, '#fff', .9, true); return; }
  P.cls = c; P.swCd = .3; P.atkT = Math.min(P.atkT, .12); G.switches++; G.usedCls[c] = 1;
  SFX.play('switch'); tutDone('cls');
  // 换装冲击
  const range = .3 + G.mods.shock * .15, dm = baseDmg(c) * .4 * (1 + G.mods.shock);
  G.enemies.forEach(e => { if (!e.dead && !e.boss && Math.abs(e.laneF - P.lane) < .5 && PT - e.t < range) hitEnemy(e, dm, c, { kb: .07, quiet: true }); });
  fxAdd('ring', laneX(P.laneF, PT), laneY(PT) - 40, { life: .35, s: 1, col: C[c] });
}
function skillOf(c) { return weaponOf(c); }
function castSkill() {
  const P = G.P, c = P.cls, w = skillOf(c);
  if (P.energy < 100) { fxText('能量未满', laneX(P.laneF, PT), laneY(PT) - 260, 28, '#888', .7); return; }
  P.energy = 0; SFX.play('skill'); G.shake = 14; tutDone('skill');
  const dm = baseDmg(c) * 4, live = () => G.enemies.filter(e => !e.dead);
  fxText(w.skill, 360, 560, 72, C[c], 1.2, true);
  P.animK = 'atk'; P.anim = .3;
  const sk = w.sk;
  if (sk === 'sweep') {
    fxAdd('sweep', 360, 900, { life: .5, s: 1, grow: .3 });
    live().forEach(e => { if (e.t > .45) hitEnemy(e, dm, c, { kb: e.boss ? 0 : .12, quiet: true }); });
  } else if (sk === 'hook') {
    live().forEach(e => { hitEnemy(e, dm * .6, c, { kb: e.boss ? 0 : .2, quiet: true }); e.slow = 4; fxSpr2('hook', e, -10, .5); });
  } else if (sk === 'dash') {
    G.skillFx = { k: 'dash', t: 0, dur: .9, lanes: [0, 1, 2], hit: new Set(), dm: dm * 1.1, c };
  } else if (sk === 'charge') {
    P.animK = 'charge'; P.anim = .6;
    live().forEach(e => { if (Math.abs(e.laneF - P.lane) < .6) hitEnemy(e, dm * 1.25, c, { kb: e.boss ? 0 : .1, quiet: true }); });
    for (let i = 0; i < 6; i++) fxAdd('smoke', laneX(P.lane, PT - i * .14), laneY(PT - i * .14), { life: .5 + i * .05, s: .6, grow: .4 });
  } else if (sk === 'zigzag') {

  } else if (sk === 'rain') {

  } else if (sk === 'meteor') {

    for (let i = 0; i < 6; i++) {
      const e = tg[i % Math.max(1, tg.length)];
      G.proj.push({ k: 'meteor', lane: e ? e.lane : i % 3, t: e ? e.t : .3 + i * .1, h: 1, delay: i * .12, dmg: dm * .8, cls: c, r: .16, quiet: true });
    }
  } else if (sk === 'thunder') {

  } else if (sk === 'venom') {
    live().forEach(e => { hitEnemy(e, dm * .3, c, { quiet: true }); e.poison = 5; e.poisD = dm * .12; e.slow = 3; fxSpr2('venom', e, -10, .6); });
  } else if (sk === 'quake') {

  } else if (sk === 'crescent') {

  } else if (sk === 'tornado') {
    live().forEach(e => { hitEnemy(e, dm * .4, c, { kb: e.boss || ENEMY[e.type].heavy ? 0 : .3, quiet: true }); e.slow = 3; });
    for (let l = 0; l < 3; l++) fxAdd('tornado', laneX(l, .55), laneY(.55), { life: 1.1, s: 1, vy: -140, rot: 0 });
  } else if (sk === 'bagua') {

    if (c.h > 0) c.h = Math.max(0, c.h - dt * .9); else c.t += dt * .05;

}
function hitCrate(c) {
  c.hp--; fxAdd('hit', laneX(c.lane, c.t), laneY(c.t) - 40 * depthS(c.t), { life: .2, s: .5 });
  if (c.hp > 0) return;
  c.done = 1; SFX.play('coin');
  const x = laneX(c.lane, c.t), y = laneY(c.t) - 60;
  if (G.wall < G.wallMax && Math.random() < .5) { G.wall = Math.min(G.wallMax, G.wall + 2); fxText('补给: 城墙修复', x, y - 40, 32, '#45bf66', 1.1, true); }
  else { G.P.energy = Math.min(100, G.P.energy + 50); fxText('补给: 能量 +50', x, y - 40, 32, C.gold, 1.1, true); }
  fxAdd('poof', x, y, { life: .4, s: .7, grow: .5 });
}

// 特殊敌人每帧行为；返回 true 表示本帧跳过移动
function foeAI(e, dt) {
  const ty = e.type;
  if (ty === 'assassin') {
    e.skT -= dt;
    if (e.hide > 0 && e.t < .62) { e.hidden = (G.time * 1.3 + e.ph) % 2.4 < 1.7; } else e.hidden = false;
    if (e.t >= .62 && !e.dashed) { e.dashed = 1; e.fast = .9; fxText('突进!', laneX(e.laneF, e.t), laneY(e.t) - 200 * depthS(e.t), 26, RED, .6); }
  } else if (ty === 'scorpion') {
    e.skT -= dt;
    if (e.skT <= 0) { e.hidden = !e.hidden; e.skT = e.hidden ? 1.4 : 2 + Math.random(); if (e.hidden) fxAdd('poof', laneX(e.laneF, e.t), laneY(e.t) - 10, { life: .3, s: .4 * depthS(e.t) }); }
    if (e.t > .78) e.hidden = false;
  } else if (ty === 'drummer') {
    e.skT -= dt;
    if (e.skT <= 0) { e.skT = 2.2; e.atkT = .3; fxAdd('note', laneX(e.laneF, e.t) + 30, laneY(e.t) - 150 * depthS(e.t), { life: .8, s: .9, vy: -60 }); G.enemies.forEach(o => { if (o !== e && !o.dead && !o.boss && Math.abs(o.laneF - e.laneF) < .6) o.fast = 1.8; }); }
  } else if (ty === 'healer') {
    e.skT -= dt;
    if (e.skT <= 0) {
      e.skT = 3; e.atkT = .3;
      G.enemies.forEach(o => { if (!o.dead && !o.boss && Math.abs(o.laneF - e.laneF) < 1.2 && Math.abs(o.t - e.t) < .2 && o.hp < o.maxHp) { o.hp = Math.min(o.maxHp, o.hp + o.maxHp * .3); fxAdd('heal', laneX(o.laneF, o.t), laneY(o.t) - 160 * depthS(o.t), { life: .7, s: .8, vy: -50 }); } });
    }
  } else if (ty === 'croc') {
    // 潜水：时隐时现，接近城墙后浮出
    e.skT -= dt;
    if (e.skT <= 0) { e.hidden = !e.hidden; e.skT = e.hidden ? .9 : 2.4 + Math.random(); fxAdd('splash', laneX(e.laneF, e.t), laneY(e.t) - 10, { life: .35, s: .7 * depthS(e.t) }); }
    if (e.t > .52) e.hidden = false;
  } else if (ty === 'eagle') {
    // 盘旋左右摆动，到中段俯冲
    if (!e.dived) e.laneF = e.lane + Math.sin(G.time * 2.2 + e.ph) * .3;
    if (e.t > .5 && !e.dived) { e.dived = 1; e.fast = .9; e.laneF = e.lane; fxText('俯冲!', laneX(e.laneF, e.t), laneY(e.t) - 260 * depthS(e.t), 26, RED, .6); }
  } else if (ty === 'catapult') {
    if (e.t >= .3 && (e.shots || 0) < 4) {
      e.shootT = (e.shootT || 1) - dt;
      if (e.shootT <= 0) {
        e.shootT = 3.4 - Math.min(1, G.diff * .02); e.shots = (e.shots || 0) + 1; e.atkT = .4;
        G.proj.push({ k: 'rock', lane: G.P.lane, l0: e.laneF, t0: e.t, f: 0, dur: 1.4, enemy: true });
      }
      return true;
    }
  } else if (ty === 'boar' && !e.stampede) {
    // 刨地蓄势后冲锋
    if (!e.rush && e.t > .3 && !e.pawed) { e.pawed = 1; e.paw = 1; }
    if (e.paw > 0) { e.paw -= dt; e.atkT = .2; if (e.paw <= 0) { e.rush = 1; fxText('冲!', laneX(e.laneF, e.t), laneY(e.t) - 160 * depthS(e.t), 28, RED, .5); } return true; }
  }
  return false;
}

/* ---------- 主更新 ---------- */
function update(rdt) {
  if (!G || G.paused) return;
  G.rt += rdt;
  if (G.banner) { G.banner.t += rdt; if (G.banner.t > 2.2) G.banner = null; }
  if (G.upg) return;            // 三选一时暂停
  if (G.qte) updateQTE(rdt);
  if (G.qteCool > 0) G.qteCool -= rdt;
  const tsTarget = G.qte && !G.qte.res ? .2 : 1;
  G.ts += (tsTarget - G.ts) * Math.min(1, rdt * (tsTarget < G.ts ? 20 : 5));
  if (G.hitstop > 0) { G.hitstop -= rdt; return updateFx(rdt * .3); }
  const dt = rdt * G.ts;
  G.time += dt; G.stateT += dt;
  G.shake = Math.max(0, G.shake - rdt * 40);
  updateFx(rdt);
  if (G.state === 'end') return;
  if (G.ctrBuff > 0) G.ctrBuff -= dt;
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0 && G.combo > 0) breakCombo(); }

  // 出兵
  if (G.state === 'wave') {
    G.spawnT += dt;
    while (G.spawns.length && G.spawns[0].t <= G.spawnT) spawnEnemy(G.spawns.shift());
    if (G.bossPending && !G.boss && G.spawnT > 1.5) { G.bossPending = false; spawnBoss(); }
    if (!G.spawns.length && !G.bossPending && !G.boss && G.enemies.every(e => e.dead)) waveClear();
  }
  updateHazard(dt);
  updateEvents(dt);
  updateSkillFx(dt);
  G.envT += dt; if (G.flashT > 0) G.flashT -= dt; if (G.frostT > 0) G.frostT -= dt; if (G.laneCd > 0) G.laneCd -= rdt;
  if (G.bot) bot(dt);

  // 玩家
  const P = G.P;
  P.laneF += (P.lane - P.laneF) * Math.min(1, dt * (P.slide > 0 ? 7 : 16));
  if (P.swCd > 0) P.swCd -= dt;
  if (P.flinch > 0) P.flinch -= dt;
  if (P.slide > 0) P.slide -= dt;
  if (P.anim > 0) P.anim -= dt;
  if (P.hold >= 0 && !G.qte) { P.hold += rdt; P.charging = P.hold > .35 ? Math.min(1, (P.hold - .35) / .25) : 0; }
  P.atkT -= dt;
  if (P.atkT <= 0 && P.flinch <= 0 && P.slide <= 0 && !G.qte) {
    const r = playerAttack(), tide = G.hazard.kind === 'tide' && G.hazard.on > 0 && G.hazard.lane === P.lane;
    P.atkT = r ? r * (G.buf.haste > 0 ? .55 : 1) * (tide ? 1.4 : 1) : .05;
  }
  updateAllies(dt);

  // 敌人
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.boss) { updateDot(e, dt); if (!e.dead) updateBoss(e, dt); continue; }
    if (e.stun > 0) { e.stun -= dt; continue; }
    if (e.frz > 0) { e.frz -= dt; continue; }
    if (e.slow > 0) e.slow -= dt;
    if (e.atkT > 0) e.atkT -= dt;
    updateDot(e, dt); if (e.dead) continue;
    if (foeAI(e, dt)) continue;
    if (e.fast > 0) e.fast -= dt;
    const inTide = G.hazard.kind === 'tide' && G.hazard.on > 0 && Math.abs(e.laneF - G.hazard.lane) < .5 && !ENEMY[e.type].fly && e.type !== 'croc' && e.type !== 'crab';
    let spd = e.spd * (e.slow > 0 ? .5 : 1) * (envOf().spd || 1) * (e.fast > 0 ? 1.6 : 1) * (e.rush && !e.stampede ? 2.4 : 1) * (inTide ? .55 : 1);
    if (e.type === 'bow' && e.t >= e.stopAt && e.st === 'walk') { e.st = 'shoot'; e.shootT = .6; }
    if (e.st === 'shoot') {
      spd *= .2; e.shootT -= dt;
      if (e.shootT <= 0) { e.shootT = 2.6 - Math.min(1, G.diff * .02); G.proj.push({ k: 'earrow', lane: Math.round(e.laneF), to: P.lane, t: e.t + .02, t0: e.t + .02, spd: .9, enemy: true }); e.tele = .2; e.atkT = .3; e.shots = (e.shots || 0) + 1; if (e.shots >= 3) e.st = 'walk', e.stopAt = 9; }
    }
    if (e.tele > 0) e.tele -= dt;
    if (e.laneChg > 0 && e.t >= e.laneChg) {
      e.laneChg = -1; const opts = [e.lane - 1, e.lane + 1].filter(l => l >= 0 && l <= 2);
      e.laneTo = opts[Math.random() * opts.length | 0]; e.chgT = .5;
    }
    if (e.chgT > 0) { e.chgT -= dt; if (e.chgT <= 0) e.lane = e.laneTo; }
    e.laneF += (e.lane - e.laneF) * Math.min(1, dt * 5);
    e.t += spd * dt;
    // 精英拼刀
    if (e.elite && !G.qte && G.qteCool <= 0 && e.parries < 2 && e.t >= .6 + e.parries * .12) { startQTE('parry', e); continue; }
    // 与玩家接战
    if (Math.abs(e.laneF - P.lane) < .4 && e.t + e.reach >= PT - .06 && e.t < PT && !e.hidden) {
      e.atkT = .3;
      if (e.type === 'bomber') { e.dead = 1; G.waveDone++; bomberBlast(e, true); continue; }
      if (P.flinch <= 0) playerHit(ENEMY[e.type].atk);
      if (e.stampede) { e.stampede = 0; e.rush = 0; e.spd = ENEMY.boar.spd * G.spdMul; }
      e.t -= ENEMY[e.type].heavy ? .05 : .12; e.stun = .4;
      continue;
    }
    if (e.t >= 1) { e.dead = 1; G.waveDone++; wallDmg(e.elite ? 6 : 3, laneX(e.laneF, 1), laneY(1)); }
  }
  G.enemies = G.enemies.filter(e => !e.dead || e.boss);
  if (G.boss && G.boss.dead) G.boss = null;

  // 投射物
  for (const p of G.proj) {
    if (p.done) continue;
    if (p.k === 'arrow' || p.k === 'bullet') {
      p.t -= p.spd * dt;
      for (const e of G.enemies) {
        if (e.dead || p.hitS.has(e.id) || Math.abs(e.laneF - p.lane) > .5 || e.st === 'enter' && e.boss) continue;
        if (p.t <= e.t + e.reach && p.t > e.t - (p.k === 'bullet' ? .1 : .06)) {
          p.hitS.add(e.id); const d = hitEnemy(e, p.dmg, p.cls, { kb: p.k === 'bullet' ? .03 : .01, quiet: p.quiet && Math.random() < .7, force: p.force });
          if (p.burn && d > 0) { e.burn = 3; e.burnD = p.dmg * .15; }
          if (p.shell) { explode({ lane: p.lane, t: e.t, dmg: p.dmg * .6, cls: p.cls, r: .1, quiet: true }); p.done = 1; break; }
          if (p.hitS.size >= p.pierce) { p.done = 1; break; }
        }
      }
      for (const c of G.events) if (!c.done && c.h <= 0 && Math.abs(c.lane - p.lane) < .5 && Math.abs(p.t - c.t) < .05 && !p.hitS.has('c' + c.lane)) { p.hitS.add('c' + c.lane); hitCrate(c); if (!p.big) p.done = 1; }
      if (p.t < -.02) p.done = 1;
    } else if (p.k === 'orb') {
      const tg = G.enemies.find(e => e.id === p.tid && !e.dead);
      p.t -= p.spd * dt;
      const goal = tg ? tg.t + tg.reach : -1;
      if (tg) p.lane += (tg.laneF - p.lane) * Math.min(1, dt * 8);
      if (p.t <= goal || p.t < 0) { p.done = 1; if (p.t >= 0) explode(p); }
    } else if (p.k === 'drop') {
      const tg = G.enemies.find(e => e.id === p.tid && !e.dead);
      if (tg) { p.lane = tg.laneF; p.t = tg.t; }
      p.h -= dt * 3; if (p.h <= 0) { p.done = 1; if (tg) hitEnemy(tg, p.dmg, p.cls, { quiet: true }); }
    } else if (p.k === 'meteor') {
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.h -= dt * 2.4; if (p.h <= 0) { p.done = 1; explode(p); G.shake = 8; }
    } else if (p.k === 'rock') {
      // 投石车的石头：抛物线落到开火时玩家所在战道，看地上影子躲开
      p.f += dt / p.dur;
      if (p.f >= 1) {
        p.done = 1; fxAdd('smoke', laneX(p.lane, PT), laneY(PT) - 20, { life: .5, s: .8, grow: .5 }); SFX.play('boom'); G.shake = Math.max(G.shake, 6);
        if (Math.abs(P.laneF - p.lane) < .5) { playerHit(.8); fxText('被石头砸中!', laneX(P.laneF, PT), laneY(PT) - 260, 30, RED, .8, true); }
      }
    } else if (p.k === 'earrow') {
      p.t += p.spd * dt;
      // 斜射向开火时玩家所在战道
      if (p.to !== undefined) p.laneC = p.lane + (p.to - p.lane) * Math.min(1, (p.t - p.t0) / Math.max(.05, PT - p.t0));
      if (Math.abs(P.laneF - (p.laneC ?? p.lane)) < .5 && p.t >= PT - .06 && p.t < PT + .04) { p.done = 1; playerHit(); fxText('中箭!', laneX(P.laneF, PT), laneY(PT) - 250, 28, RED, .6); }
      else if (p.t >= 1) { p.done = 1; fxAdd('poof', laneX(p.to ?? p.lane, 1), laneY(1) - 20, { life: .3, s: .4 }); }
    }
  }
  G.proj = G.proj.filter(p => !p.done);
}

function waveClear() {
  if (G.mode === 'level' && G.wave >= G.nWaves) { endGame(true); return; }
  G.state = 'gap'; G.stateT = 0;
  SFX.play('coin');
  const showUpg = G.mode === 'level' || G.wave % 2 === 1 || G.wave % 5 === 0;
  if (showUpg) openUpgrade(); else setTimeout(() => G && G.state === 'gap' && G.mode !== 'level' && startEndlessWave(G.wave + 1), 900);
}
function openUpgrade() {
  const pool = UPGRADES.filter(u => !(u.id === 'heart' && G.wallMax >= 15));
  const pick = []; while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  G.upg = { list: pick, t: 0 };
  if (G.bot) chooseUpgrade(0);
}
function chooseUpgrade(i) {
  const u = G.upg.list[i]; G.upg = null; G.picks.push(u.id);
  if (u.id === 'heart') { G.wallMax += 3; G.wall = Math.min(G.wallMax, G.wall + 3); }
  else G.mods[u.id]++;
  SFX.play('ui');
  if (G.mode === 'level') nextWave(); else startEndlessWave(G.wave + 1);
}

/* ---------- 结算 ---------- */
function endGame(win) {
  if (G.state === 'end') return;
  G.state = 'end'; G.win = win; G.stateT = 0;
  G.qte = null; G.bossTele = null;
  win ? SFX.play('win') : SFX.play('lose');
  const res = { win, mode: G.mode, score: G.score, maxCombo: G.maxCombo, perfects: G.perfects, qteN: G.qteN, wall: G.wall, wallMax: G.wallMax, wallLost: G.wallLost, kills: G.kills, wave: G.wave, shards: 0, newAch: [] };
  res.ctrRate = G.hits ? G.ctrHits / G.hits : 0; res.drops = G.drops;
  const unlock = id => { if (!SAVE.ach[id]) { SAVE.ach[id] = 1; res.newAch.push(id); } };
  if (G.maxCombo >= 100) unlock('combo100');
  if (G.switches >= 100) unlock('switch100');
  if (G.perfects >= 5) unlock('perfect5');
  if ((SAVE.st.exec || 0) >= 10) unlock('execute10');
  if (G.mode === 'level') {
    const lv = G.lv, rec = SAVE.lv[lv.idx] || { stars: 0, best: 0, rank: '' };
    res.label = lv.label; res.sname = SCENES[lv.sc].name; res.target = lv.target; res.idx = lv.idx;
    if (win) {
      let stars = 1; if (G.wallLost === 0) stars++; if (G.score >= lv.target) stars++;
      const ratio = G.score / lv.target;
      res.rank = ratio >= 1 && res.ctrRate >= .85 ? 'S' : ratio >= .7 ? 'A' : ratio >= .45 ? 'B' : 'C';
      res.stars = stars;
      res.gapS = Math.max(0, lv.target - G.score);
      res.prevBest = rec.best; res.newBest = G.score > rec.best;
      const newStars = Math.max(0, stars - rec.stars);
      res.shards = G.shardsGot + newStars;
      rec.stars = Math.max(rec.stars, stars); rec.best = Math.max(rec.best, G.score);
      const RK = 'CBAS'; if (RK.indexOf(res.rank) > RK.indexOf(rec.rank || '')) rec.rank = res.rank;
      SAVE.lv[lv.idx] = rec;
      if (lv.idx > SAVE.maxClear) { SAVE.maxClear = lv.idx; res.firstClear = true; }
      SAVE.cur = Math.min(LAST, Math.max(SAVE.cur, lv.idx + 1));
      if (res.rank === 'S') unlock('first_s');
      if (lv.boss && G.wallLost === 0) unlock('nohit_boss');
      if (Object.keys(G.usedCls).length === 1 && G.usedCls.bow) unlock('bow_only');
      if (lv.idx === LAST) unlock('clear_all');
      if (FOES.every(k => SAVE.codex[k])) unlock('codex_all');
      if (SPIRITS.every(s => spiritOpen(s.k))) unlock('zodiac_all');
      if (res.firstClear) {
        WEAPON_UNLOCK.forEach((u, i) => { if (i && u === lv.idx) res.unlockW = i; });
        res.unlockS = SPIRITS.filter(s => s.un === lv.idx).map(s => s.name);
        res.unlockC = CLS.filter(c => CLS_UNLOCK[c] === lv.idx).map(c => CLASS_INFO[c].name);
      }
    } else {
      res.shards = Math.floor(G.shardsGot / 2);
      res.prevBest = rec.best; res.gapS = lv.target - G.score;
    }
  } else {
    res.sname = G.mode === 'daily' ? '每日挑战' : '无尽模式';
    res.shards = G.shardsGot;
    if (G.mode === 'daily') { if (SAVE.daily.seed !== G.seed) SAVE.daily = { seed: G.seed, best: 0 }; res.prevBest = SAVE.daily.best; res.newBest = G.score > SAVE.daily.best; SAVE.daily.best = Math.max(SAVE.daily.best, G.score); }
    else { res.prevBest = SAVE.eBest; res.newBest = G.score > SAVE.eBest; SAVE.eBest = Math.max(SAVE.eBest, G.score); }
    SAVE.eWave = Math.max(SAVE.eWave, G.wave);
    if (G.wave >= 20) unlock('endless20');
  }
  SAVE.shards += res.shards;
  writeSave();
  G.result = res;
  setTimeout(() => listeners.onResult && listeners.onResult(res), win ? 1100 : 900);
}

/* ---------- 特效数据（渲染在 render.js） ---------- */
function fxAdd(k, x, y, o = {}) { if (G.fx.length > 140) G.fx.shift(); G.fx.push({ k, x, y, t: 0, life: .4, s: 1, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, ...o }); }
function fxSpr2(k, e, dy, life) { fxAdd(k, laneX(e.laneF, e.t), laneY(e.t) - 120 * depthS(e.t) + dy, { life, s: .8 * Math.max(.7, depthS(e.t)), vy: -40 }); }
function fxText(s, x, y, size, col, life = .8, pop) { if (G.texts.length > 40) G.texts.shift(); G.texts.push({ s, x, y, size, col, t: 0, life, pop }); }
function updateFx(dt) {
  for (const f of G.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += f.g * dt; f.rot += f.vr * dt; }
  G.fx = G.fx.filter(f => f.t < f.life);
  for (const t of G.texts) { t.t += dt; t.y -= 40 * dt; }
  G.texts = G.texts.filter(t => t.t < t.life);
}

/* ---------- 新手提示（仅首关，做过就消失） ---------- */
function tutDone(k) { if (!SAVE.tut[k]) { SAVE.tut[k] = 1; writeSave(); } }

/* ---------- 机器人（用于自动测试与目标分校准） ---------- */
function bot(dt) {
  const P = G.P; G.botT = (G.botT || 0) - dt;
  if (G.botT > 0 || G.qte) return;
  G.botT = .18 + Math.random() * .12;
  const live = G.enemies.filter(e => !e.dead && e.t > .02 && e.st !== 'enter');
  if (!live.length) return;
  // 选择威胁最大的战道：最靠近底部的敌人
  const danger = [0, 1, 2].map(l => {
    const es = live.filter(e => Math.round(e.laneF) === l);
    return { l, es, d: es.reduce((m, e) => Math.max(m, e.t + (e.elite ? .2 : 0) + (e.st === 'shoot' ? .3 : 0)), -1) };
  });
  if (G.hazard.on > 0 || G.hazard.warn > 0) danger.forEach(o => { if (o.l === G.hazard.lane) o.d -= 2; });
  if (G.skillFx) return;
  danger.sort((a, b) => b.d - a.d);
  const tgtLane = G.boss && danger[0].d < .55 ? Math.round(G.boss.laneF) : danger[0].l;
  if (tgtLane !== P.lane) { G.laneCd = 0; moveLane(tgtLane > P.lane ? 1 : -1); }

      const x = 250 + i * 190; drawSpr(g, tagSpr(e, false), x, my + 24, 1.25); T(g, nm, x + 26, my + 24, 21, { align: 'left', col: INK });
    });
    g.globalAlpha = 1;
    T(g, '通关 1-8 解锁火铳手 · 专破铁浮屠 / 飞鹰 / 巨蟹', 360, my + 112, 20, { col: '#8a6a4a' });
    T(g, `底部便签会提示「克它!」 图鉴里能查全部 ${FOES.length} 种敌人`, 360, my + 142, 20, { col: '#8a6a4a' });
  } else {
    T(g, '怎 么 玩', 360, cy - 500, 58, { col: INK });
    const rows = [
      ['swipe', '左右滑动', '换战道 (一次一道)'],
      ['tap', '点底部便签', '切换兵种 · 用克制的打'],
      ['hold', '长按战场', '能量满后蓄力 松手放技能'],
      ['qte', '屏幕变暗时', '按提示 点击 / 狂点 / 滑动'],
      ['spirit', '点右下角战兽', '击败敌人攒满士气 召唤战兽助战'],
      ['wall', '守住城墙', '漏掉的敌人会撞城墙扣心'],
    ];
    rows.forEach(([ic, a, b], i) => {
      const y = cy - 380 + i * 128, k = Math.min(1, Math.max(0, (t - i * .12) * 4));
      g.globalAlpha = k; g.save(); g.translate((1 - k) * 80, 0);
      shape(g, ell(150, y, 52, 52), { fill: ['#bcd4ff', '#ffc2b8', '#e0caff', '#fff3a8', '#ffe0e6', '#ffd0d4'][i], w: 4 });
      guideIcon(g, ic, 150, y, t);
      T(g, a, 230, y - 22, 36, { align: 'left', col: INK });
      T(g, b, 230, y + 24, 24, { align: 'left', col: '#5a4030' });
      g.restore(); g.globalAlpha = 1;
    });
  }
  // 翻页 / 开打
  if (pg === 0) {
    btn(g, 360, cy + 480, 340, 90, '下一页 →', '#ff8a3c', () => { UI.page = 1; UI.t0 = performance.now(); SFX.play('ui'); }, { size: 40 });
  } else {
    btn(g, 200, cy + 480, 200, 80, '← 上一页', '#e3c69a', () => { UI.page = 0; UI.t0 = performance.now(); SFX.play('ui'); }, { size: 28, col: INK, ink: false });
    btn(g, 470, cy + 480, 300, 90, UI.from === 'menu' ? '知道了' : '开 打!', '#45bf66', () => { SFX.play('ui'); closeGuide(); }, { size: 44 });
  }
  if (UI.from !== 'boot') btn(g, 640, cy - 500, 64, 64, '×', '#e3c69a', () => closeGuide(), { size: 40, col: INK, ink: false });
}
// 操作示意小图标（带简单循环动画）
function guideIcon(g, k, x, y, t) {
  if (k === 'swipe') {
    const d = Math.sin(t * 3) * 18;
    arrowD(g, [[x - 34, y + 22], [x + 34, y + 22]], INK, 3, 8); arrowD(g, [[x + 34, y + 22], [x - 34, y + 22]], INK, 3, 8);
    fingerIcon(g, x + d, y - 6);
  } else if (k === 'tap') {
    shape(g, box(x - 26, y - 24, 52, 44, 6), { fill: C.spear, w: 3 }); T(g, '枪', x, y - 2, 30, { col: '#fff', ink: true, ow: 3 });
    fingerIcon(g, x + 14, y + 16 - Math.abs(Math.sin(t * 5)) * 8);
  } else if (k === 'hold') {
    const p = (t * .8) % 1;
    g.lineWidth = 7; g.strokeStyle = '#fff'; g.beginPath(); g.arc(x, y - 6, 28, 0, 7); g.stroke();
    g.strokeStyle = C.mage; g.lineWidth = 6; g.beginPath(); g.arc(x, y - 6, 28, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); g.stroke();
    fingerIcon(g, x + 4, y + 10);
  } else if (k === 'qte') {
    g.setLineDash([10, 7]); g.lineWidth = 5; g.strokeStyle = C.gold; g.beginPath(); g.arc(x, y, 18 + ((t * 30) % 22), 0, 7); g.stroke(); g.setLineDash([]);
    T(g, '!', x, y, 40, { col: RED, ink: true, ow: 4 });
  } else if (k === 'spirit') {
    drawSpr(g, spiritBtnSpr('hound'), x, y - 4 + Math.sin(t * 5) * 3, 1);
  } else {
    drawSpr(g, heartSpr(true), x - 18, y, .8); drawSpr(g, heartSpr(Math.sin(t * 4) > 0), x + 18, y, .8);
  }
}
function fingerIcon(g, x, y) {
  shape(g, [[x - 9, y + 26], [x - 9, y - 16], [x - 4, y - 24], [x + 3, y - 24], [x + 7, y - 16], [x + 7, y - 2], [x + 16, y + 2], [x + 15, y + 26]], { fill: '#fff', w: 3, seg: 10 });
}

'use strict';
/* ================= 调试窗口：跳关 / 解锁 / 城墙无敌 / 充能（暂停菜单右上角「调试」进入） ================= */
const DBG = { god: false };
function openDebug(from) { UI = { k: 'debug', t: 0, from: from || 'menu', page: G && G.mode === 'level' ? G.lv.sc : 0 }; }
function dbgJump(idx) {
  // 跳关时把前面的关卡视为已通关，保证兵种 / 武器 / 战兽按进度解锁
  SAVE.maxClear = Math.max(SAVE.maxClear, idx - 1); writeSave();
  closeUI(); startLevel(idx);
}
function drawDebug(g) {
  dim(g, .7); const cy = VH / 2, pg = UI.page || 0;
  notePanel(g, 360, cy, 660, 1120, 0, '#f2f6ff', false);
  T(g, '调 试 窗 口', 360, cy - 500, 48, { col: '#2a58a8' });
  T(g, '仅用于测试 · 改动会写入存档', 360, cy - 450, 20, { col: '#8a6a4a' });
  // 场景页签：8 个场景
  SCENES.forEach((s, i) => {
    const x = 104 + (i % 4) * 171, y = cy - 390 + (i / 4 | 0) * 62, on = i === pg;
    btn(g, x, y, 156, 52, `${i + 1} ${s.name}`, on ? '#4d8df0' : '#e3e8f2', () => { UI.page = i; SFX.play('ui'); }, { size: 20, col: on ? '#fff' : INK, ink: on });
  });
  // 本场景 8 关：直接进入
  for (let i = 0; i < 8; i++) {
    const idx = pg * 8 + i, x = 128 + (i % 4) * 155, y = cy - 220 + (i / 4 | 0) * 92, boss = i === 7, cur = G && G.mode === 'level' && G.lv.idx === idx;
    btn(g, x, y, 136, 76, lvLabel(idx) + (boss ? ' 王' : ''), cur ? '#45bf66' : boss ? '#ff8a8a' : '#fff', () => dbgJump(idx), { size: 30, col: cur || boss ? '#fff' : INK, ink: cur || boss });
  }
  // 局内操作
  const inLv = G && G.mode === 'level' && G.state !== 'end';
  T(g, '当前局', 84, cy - 22, 24, { align: 'left', col: '#2a58a8' });
  T(g, inLv ? `${G.lv.label} 第 ${G.wave}/${G.nWaves} 波` : '不在关卡中', 180, cy - 22, 22, { align: 'left', col: INK });
  const ops = [
    ['跳到下一波', inLv && G.wave < G.nWaves, () => { G.enemies = []; G.spawns = []; G.proj = []; nextWave(); closeUI(); }],
    ['直接打 Boss', inLv, () => { const idx = G.lv.sc * 8 + 7; dbgJump(idx); }],
    ['清空敌人', inLv, () => { G.enemies.forEach(e => { if (!e.boss) killEnemy(e, 'qte', false); }); closeUI(); }],
    ['直接通关', inLv, () => { G.wave = G.nWaves; G.score = Math.max(G.score, G.lv.target); G.hits = G.hits || 10; G.ctrHits = G.hits; closeUI(); endGame(true); }],
    ['能量 / 士气满', !!G, () => { G.P.energy = 100; G.spE = 100; closeUI(); }],
    [DBG.god ? '无敌: 开' : '无敌: 关', true, () => { DBG.god = !DBG.god; }],
  ];
  ops.forEach(([l, ok, fn], i) => btn(g, 152 + (i % 3) * 208, cy + 40 + (i / 3 | 0) * 80, 192, 64, l, !ok ? '#ddd' : l.startsWith('无敌: 开') ? '#e23b2e' : '#ffd257', ok ? () => { SFX.play('ui'); fn(); } : null, { size: 24, col: INK, ink: false }));
  // 存档操作
  T(g, '存档', 84, cy + 210, 24, { align: 'left', col: '#2a58a8' });
  const sv = [
    ['全部解锁', () => { SAVE.maxClear = LAST; SAVE.shards += 200; FOES.forEach(k => SAVE.codex[k] = 1); writeSave(); fxOk('已解锁全部关卡 / 兵种 / 武器 / 战兽'); }],
    ['武魂 +100', () => { SAVE.shards += 100; writeSave(); fxOk('武魂 +100'); }],
    ['清空存档', () => { if (UI.confirm) { const m = SAVE.muted; SAVE = defSave(); SAVE.muted = m; SAVE.tut.guide = 1; writeSave(); UI.confirm = 0; fxOk('存档已清空'); } else UI.confirm = 1; }],
  ];
  sv.forEach(([l, fn], i) => btn(g, 152 + i * 208, cy + 270, 192, 64, i === 2 && UI.confirm ? '再点一次确认' : l, i === 2 ? '#ff8a8a' : '#bcd4ff', () => { SFX.play('ui'); if (i !== 2) UI.confirm = 0; fn(); }, { size: i === 2 && UI.confirm ? 20 : 24, col: INK, ink: false }));
  T(g, `已通关到 ${SAVE.maxClear >= 0 ? lvLabel(SAVE.maxClear) : '无'} · 武魂 ${SAVE.shards} · 出战 ${SPIRIT[SAVE.spirit].name}`, 360, cy + 350, 20, { col: '#5a4030' });
  if (UI.msg && UI.msgT > performance.now()) T(g, UI.msg, 360, cy + 390, 24, { col: '#23803d' });
  btn(g, 360, cy + 480, 220, 64, '返回', '#e3c69a', () => { UI = { k: UI.from || 'menu', t: 0 }; }, { size: 28, col: INK, ink: false });
}
function fxOk(s) { UI.msg = s; UI.msgT = performance.now() + 1800; }

'use strict';
/* ================= 启动 / 画布适配 / 触摸输入 / 主循环 ================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1, lastT = 0, lowFps = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // 逻辑宽固定 720，高按屏幕比例，最少 1280（窄长屏向上延伸），最多 1560
  const ar = h / w;
  VH = Math.round(Math.min(1560, Math.max(1280, 720 * ar)));
  SCALE = Math.min(w / 720, h / VH);
  cv.style.width = Math.round(720 * SCALE) + 'px'; cv.style.height = Math.round(VH * SCALE) + 'px';
  cv.width = Math.round(720 * SCALE * DPR); cv.height = Math.round(VH * SCALE * DPR);
  OY = Math.round((VH - 1280) * .5);
  const sat = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  SAFE_T = Math.round(sat / SCALE);
  const q = Math.min(2, Math.max(.75, SCALE * DPR * (lowFps > 30 ? .75 : 1)));
  if (Math.abs(q - SQ) > .2) { SQ = q; clearSprites(); }
  document.getElementById('rot').style.display = w > h * 1.15 && w > 600 && 'ontouchstart' in window ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ---------- 开局 ---------- */
let lastStart = null;
function startLevel(idx) {
  lastStart = ['level', idx]; newGame('level', idx); SFX.music(true, idx / 8 % 2 | 0); prewarm();
  SAVE.cur = idx; writeSave();
}
function startMode(m) { lastStart = [m, 0]; newGame(m, 0); SFX.music(true, 1); prewarm(); }
function restart() { if (lastStart) lastStart[0] === 'level' ? startLevel(lastStart[1]) : startMode(lastStart[0]); }
listeners.onResult = res => { UI = { k: 'result', t: 0, res }; };
const _closeUI = closeUI;
closeUI = function () { if (G && G.state === 'end' && G.result) { UI = { k: 'result', t: 9, res: G.result }; return; } _closeUI(); };

// 预生成常用精灵，避免战斗中首次出现时卡顿
function prewarm() {
  sceneSpr(SCENES[G.sc].key);
  CLS.forEach(c => ['idle', 'wind', 'strike'].forEach(p => backSpr(c, p, 0)));
  spiritBtnSpr(SAVE.spirit); for (let ph = 0; ph < 4; ph++) spiritBackSpr(SAVE.spirit, ph);
  Object.keys(enemyPool(G.sc, 7)).forEach(t => { unitSpr(t, true, 0); unitSpr(t, true, 1); unitSpr(t, true, 2); tagSpr(t, false); });
}

/* ---------- 触摸 ---------- */
const touches = new Map();
const SWIPE_MIN = 58, SWIPE_MORE = 150; // 逻辑像素（画布宽 720）
function toLogic(cx, cy) { const r = cv.getBoundingClientRect(); return [(cx - r.left) / SCALE, (cy - r.top) / SCALE]; }
function findHit(x, y) { for (let i = HIT.length - 1; i >= 0; i--) { const h = HIT[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; } return null; }
function onDown(id, cx, cy) {
  SFX.init();
  const [x, y] = toLogic(cx, cy);
  const h = findHit(x, y);
  touches.set(id, { x0: x, y0: y, x, y, t0: performance.now(), h, swiped: false, field: !h && !UI && G && !G.upg });
  if (h && (h.now || UI || (G && G.upg))) { h.fn(); touches.get(id).used = true; return; }
  if (!G || UI || G.upg) return;
  if (G.qte) { if (G.qte.kind === 'parry' || G.qte.kind === 'exec') qteInput('tap'); touches.get(id).qte = true; return; }
  if (touches.get(id).field && y < VH - 210) G.P.hold = 0;
}
function onMove(id, cx, cy) {
  const t = touches.get(id); if (!t) return;
  const [x, y] = toLogic(cx, cy); t.x = x; t.y = y;
  if (t.used || t.swiped || !G || UI) return;
  const dx = x - t.x0, dy = y - t.y0;
  if (G.qte && G.qte.kind === 'block') {
    if (Math.hypot(dx, dy) > 50) { t.swiped = true; qteInput('swipe', Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); }
    return;
  }
  if (t.qte) return;
  // 一次滑动只换一道；继续同向划出较长距离（且间隔 0.18 秒）才换第二道，避免轻划就跨两道
  const need = t.moved ? SWIPE_MORE : SWIPE_MIN;
  if (Math.abs(dx) > need && Math.abs(dx) > Math.abs(dy) * 1.1 && performance.now() - (t.lastMove || 0) > 180) {
    const d = dx > 0 ? 1 : -1;
    if (t.moved && d !== t.dir) { t.x0 = x; t.y0 = y; t.dir = d; return; }
    G.P.hold = -1; G.P.charging = 0;
    moveLane(d);
    t.x0 = x; t.y0 = y; t.moved = true; t.dir = d; t.lastMove = performance.now();
  }
}
function onUp(id) {
  const t = touches.get(id); touches.delete(id); if (!t || !G) return;
  if (t.used || UI) return;
  if (t.h && !t.moved && !t.h.now) { t.h.fn(); return; }
  if (G.P.charging >= 1 && !t.moved) castSkill();
  G.P.hold = -1; G.P.charging = 0;
}
cv.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); for (const t of e.changedTouches) onUp(t.identifier); }, { passive: false });
cv.addEventListener('touchcancel', e => { for (const t of e.changedTouches) touches.delete(t.identifier); if (G) { G.P.hold = -1; G.P.charging = 0; } });
// 桌面调试：鼠标与键盘
let mouseDown = false;
cv.addEventListener('mousedown', e => { mouseDown = true; onDown('m', e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (mouseDown) onMove('m', e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; onUp('m'); } });
window.addEventListener('keydown', e => {
  SFX.init(); if (!G) return;
  const k = e.key;
  if (G.qte) {
    const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' };
    if (G.qte.kind === 'block' && m[k]) qteInput('swipe', m[k]);
    if (k === ' ') qteInput('tap');
  }
  if (k === 'ArrowLeft' || k === 'a') moveLane(-1);
  if (k === 'ArrowRight' || k === 'd') moveLane(1);
  if ('12345'.includes(k) && k.length === 1) { const c = CLS[+k - 1]; if (G.qte && G.qte.kind === 'choice') qteInput('cls', c); else switchCls(c); }
  if (k === 's' || k === 'q') summonSpirit();
  if (k === 'e' || k === 'Enter') castSkill();
  if (k === 'Escape') UI ? closeUI() : openMenu();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !UI && G.state !== 'end') openMenu(); SFX.music(!document.hidden && !!G); });
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- 主循环 ---------- */
let fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now - (lastT || now)) / 1000); lastT = now;
  fpsAcc += rdt; fpsN++;
  if (fpsAcc > 2) { const fps = fpsN / fpsAcc; if (fps < 40) lowFps++; else lowFps = Math.max(0, lowFps - 1); fpsAcc = 0; fpsN = 0; }
  if (G && !UI) update(rdt);
  else if (G && UI && G.state === 'end') update(rdt);
  render();
}
function render() {
  const g = ctx;
  g.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  g.imageSmoothingQuality = 'medium';
  HIT = [];
  if (!G) return;
  g.fillStyle = '#2a241e'; g.fillRect(0, 0, 720, VH);
  drawWorld(g);
  g.save(); g.translate(0, 0);
  drawHUD(g);
  drawBanner(g);
  drawQTE(g);
  drawUI(g);
  g.restore();
}

/* ---------- 启动：直接开局 ---------- */
function boot() {
  loadSave(); SFX.setMuted(!!SAVE.muted);
  resize();
  const idx = Math.min(LAST, Math.max(0, Math.min(SAVE.cur, SAVE.maxClear + 1)));
  startLevel(idx);
  if (!SAVE.tut.guide) openGuide('boot', 0); // 首次打开：先看克制图与操作引导（战场已在背后就绪）
  const ld = document.getElementById('ld'); if (ld) ld.remove();
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('30px BFKL'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot, boot);

</script>
